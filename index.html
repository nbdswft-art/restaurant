<body>
<title>دفتر المطعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first ledger. One content column with a fixed bottom tab bar; from 900px the bar becomes a rail on the right (RTL start). */
:root{
  /* modern light: white surfaces, each section has its own colour (--c), and the accent follows the open section */
  --bg:#F4F5FA; --surface:#FFFFFF; --sunken:#EEF0F6; --line:#E2E5EF;
  --ink:#151A2D; --muted:#5B6279; --faint:#8E94AA;
  --good:#0E9F6E; --good-soft:#DDF7EC; --warn:#B45309; --warn-soft:#FEF0D7; --bad:#DC2626; --bad-soft:#FDE4E4;
  --sh-m:#D9F5EF; --sh-m-ink:#0F766E; --sh-e:#ECE7FE; --sh-e-ink:#5B3FD0;
  --sh-f:#FEF0D7; --sh-f-ink:#9A4A07; --sh-off:#EEF0F6; --sh-off-ink:#8E94AA;
  --c-home:#5B4CF0; --c-pos:#059669; --c-shawarma:#EA580C; --c-kfc:#DC2626; --c-staff:#2563EB; --c-inv:#0D9488; --c-dishes:#DB2777; --c-exp:#D97706; --c-notes:#7C3AED; --c-drinks:#0891B2;
  --on-accent:#FFFFFF; --mix:#FFFFFF;
  --c:var(--c-home);
  --accent:var(--c); --accent-hover:color-mix(in srgb,var(--c) 85%,#000);
  --accent-soft:color-mix(in srgb,var(--c) 13%,var(--mix));
  --gold:var(--c-shawarma); --gold-soft:color-mix(in srgb,var(--c-shawarma) 14%,var(--mix));
  --plum:var(--c-notes); --plum-soft:color-mix(in srgb,var(--c-notes) 14%,var(--mix));
  --shadow:0 1px 2px rgba(21,26,45,.05),0 12px 30px rgba(21,26,45,.08);
  --shadow-sm:0 1px 2px rgba(21,26,45,.04),0 3px 10px rgba(21,26,45,.05);
  --backdrop:rgba(15,18,35,.45); --hero-ink:#FFFFFF; --hero-k:100%;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:18px; --nav-h:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --surface:#171A2E; --sunken:#20243A; --line:#2C3150;
  --ink:#ECEEF8; --muted:#A6ABC4; --faint:#717794;
  --good:#4ADE80; --good-soft:#143323; --warn:#FBBF24; --warn-soft:#3A2D10; --bad:#F87171; --bad-soft:#3D1B1F;
  --sh-m:#163A33; --sh-m-ink:#5EEAD4; --sh-e:#2A2550; --sh-e-ink:#C4B5FD;
  --sh-f:#3A2D10; --sh-f-ink:#FBBF24; --sh-off:#20243A; --sh-off-ink:#717794;
  --c-home:#818CF8; --c-pos:#34D399; --c-shawarma:#FB923C; --c-kfc:#F87171; --c-staff:#60A5FA; --c-inv:#2DD4BF; --c-dishes:#F472B6; --c-exp:#FBBF24; --c-notes:#A78BFA; --c-drinks:#22D3EE;
  --on-accent:#0E1020; --mix:#0E1020;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3); --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --backdrop:rgba(0,0,0,.62); --hero-ink:#FFFFFF; --hero-k:58%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1020; --surface:#171A2E; --sunken:#20243A; --line:#2C3150;
  --ink:#ECEEF8; --muted:#A6ABC4; --faint:#717794;
  --good:#4ADE80; --good-soft:#143323; --warn:#FBBF24; --warn-soft:#3A2D10; --bad:#F87171; --bad-soft:#3D1B1F;
  --sh-m:#163A33; --sh-m-ink:#5EEAD4; --sh-e:#2A2550; --sh-e-ink:#C4B5FD;
  --sh-f:#3A2D10; --sh-f-ink:#FBBF24; --sh-off:#20243A; --sh-off-ink:#717794;
  --c-home:#818CF8; --c-pos:#34D399; --c-shawarma:#FB923C; --c-kfc:#F87171; --c-staff:#60A5FA; --c-inv:#2DD4BF; --c-dishes:#F472B6; --c-exp:#FBBF24; --c-notes:#A78BFA; --c-drinks:#22D3EE;
  --on-accent:#0E1020; --mix:#0E1020;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3); --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --backdrop:rgba(0,0,0,.62); --hero-ink:#FFFFFF; --hero-k:58%; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{min-height:100%}
.n{unicode-bidi:isolate;direction:ltr;font-variant-numeric:tabular-nums;display:inline-block}
.cur{font-size:.78em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}

/* ---------- navigation ---------- */
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(18,40,30,.06);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs ul{display:flex;list-style:none;margin:0;padding:0;height:var(--nav-h)}
.tabs li{flex:1;min-width:0}
.tab{position:relative;width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:500;padding:0 2px;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--k,var(--accent));font-weight:700}
.tab[aria-current="page"] .tab-ic{background:color-mix(in srgb,var(--k,var(--accent)) 14%,var(--mix));transform:translateY(-1px)}
.tab-ic{display:grid;place-items:center;width:48px;height:30px;border-radius:999px;transition:background .2s,transform .2s}
.tab-badge{position:absolute;top:7px;inset-inline-end:calc(50% - 24px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.rail-brand,.rail-foot{display:none}
@media (max-width:899px){.rail-only{display:none}}
@media (min-width:900px){.mob-only{display:none}}
main{padding-block:20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  #app{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .tabs{position:sticky;top:0;align-self:start;height:100vh;border-top:0;border-left:1px solid var(--line);box-shadow:none;padding:24px 14px;display:flex;flex-direction:column}
  .tabs ul{flex-direction:column;height:auto;gap:4px}
  .tab{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:6px 8px;border-radius:12px;height:48px}
  .tab:hover{background:var(--sunken);color:var(--ink)}
  .tab[aria-current="page"]{background:color-mix(in srgb,var(--k,var(--accent)) 10%,var(--mix))}
  .tab .tab-ic{color:var(--k)}
  .tab-ic{width:36px;height:32px}
  .tab-badge{position:static;margin-inline-start:auto;border:0}
  .rail-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px;color:var(--ink);padding:4px 8px 24px}
  .rail-brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--c-home),#8B5CF6);color:var(--hero-ink);display:grid;place-items:center;flex-shrink:0}
  .rail-brand .logo svg{width:22px;height:22px}
  .rail-foot{display:block;margin-top:auto;padding:12px 8px 0;color:var(--faint);font-size:12px}
  main{padding-block:32px 48px}
}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:6px}
.more-grid button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:16px;text-align:right;font-weight:700;font-size:15px}
.more-grid button[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft)}
.more-grid .tab-ic{background:color-mix(in srgb,var(--k) 14%,var(--mix));width:44px;height:44px;border-radius:13px;color:var(--k)}
.more-grid small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.more-grid .tab-badge{top:14px;left:14px;right:auto;inset-inline-end:auto;border-color:var(--bg)}

/* ---------- type & page head ---------- */
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:0}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:13px;font-weight:500}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-head h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-head h2 svg{width:19px;height:19px;color:var(--accent)}
.sec-head .muted{font-size:13px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pad{padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;min-width:0}
.li + .li{border-top:1px solid var(--line)}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;overflow-wrap:anywhere}
.li-meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.li-end{display:flex;align-items:center;gap:8px;flex-shrink:0}
.grid2{display:grid;gap:22px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty strong{color:var(--ink);font-size:16px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--sunken);color:var(--ink)}
.btn-danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn-sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.on{color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.plain::before{display:none}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--sunken);color:var(--muted);white-space:nowrap}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%),radial-gradient(80% 80% at 100% 100%,rgba(0,0,0,.14),transparent 60%),linear-gradient(140deg,color-mix(in srgb,var(--c) var(--hero-k),#000),color-mix(in srgb,color-mix(in srgb,var(--c) 55%,#8B5CF6) var(--hero-k),#000));color:var(--hero-ink);border-radius:24px;padding:20px;display:grid;gap:18px;box-shadow:0 14px 34px color-mix(in srgb,var(--c) 30%,transparent)}
.hero > *{position:relative}
.hero .lbl{opacity:.82;font-size:13px;font-weight:500}
.hero .big{font-family:var(--f-display);font-size:40px;line-height:1.15;font-weight:600}
.hero .big .cur{color:inherit;opacity:.75;font-family:var(--f-body)}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hero-stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;min-width:0}
.hero-stats b{display:block;font-size:17px;font-weight:700;white-space:nowrap}
.hero-stats .cur{color:inherit;opacity:.75}
.week{display:flex;align-items:flex-end;gap:8px;height:96px}
.week .bar{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:5px;height:100%;min-width:0}
.week .track{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.week .fill{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:rgba(255,255,255,.28);min-height:3px}
.week .bar.today .fill{background:var(--hero-ink)}
.week .d{font-size:11px;opacity:.8}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:end;padding:24px}}
.month-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.month-tiles div{padding:14px 16px;min-width:0}
.month-tiles div + div{border-right:1px solid var(--line)}
.month-tiles > div > span{display:block;color:var(--muted);font-size:13px}
.month-tiles b{font-size:18px;font-weight:700}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px}
.banner p{margin:0;flex:1;min-width:220px;font-size:14px}
.shift-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface);color:var(--ink)}

/* ---------- shifts ---------- */
.s-m{background:var(--sh-m);color:var(--sh-m-ink)}
.s-e{background:var(--sh-e);color:var(--sh-e-ink)}
.s-f{background:var(--sh-f);color:var(--sh-f-ink)}
.s-off{background:var(--sh-off);color:var(--sh-off-ink)}

/* ---------- POS ---------- */
.pos{display:grid;gap:18px}
@media (min-width:900px){.pos{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.cart{position:sticky;top:24px}}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.dish-btn{position:relative;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:96px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:border-color .15s,transform .08s}
.dish-btn:hover{border-color:var(--accent)}
.dish-btn:active{transform:scale(.98)}
.dish-btn .nm{font-weight:600;line-height:1.35;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.av{--k:var(--c-home);background:color-mix(in srgb,var(--k) 14%,var(--mix));color:var(--k)}
.av0{--k:var(--c-pos)} .av1{--k:var(--c-shawarma)} .av2{--k:var(--c-notes)} .av3{--k:var(--c-kfc)} .av4{--k:var(--c-staff)} .av5{--k:var(--c-dishes)} .av6{--k:var(--c-inv)} .av7{--k:var(--c-exp)} .av8{--k:var(--c-drinks)}
.dish-btn .pr{color:var(--muted);font-size:13px}
.dish-btn.in{border-color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column}
@media (max-width:899px){.cart.has{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));max-height:52vh}}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.cart-lines{overflow:auto;padding:4px 16px}
.cline{display:flex;align-items:center;gap:10px;padding:8px 0}
.cline + .cline{border-top:1px dashed var(--line)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.stepper button{width:32px;height:32px;border:0;background:var(--sunken);font-size:17px;font-weight:700;color:var(--ink);display:grid;place-items:center}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cart-foot{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.total-row{display:flex;justify-content:space-between;align-items:baseline}
.total-row b{font-size:22px;font-family:var(--f-display);font-weight:600}
.warn-note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}

/* ---------- summary strips ---------- */
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.stats > div{flex:1 1 104px;background:var(--surface);padding:12px 16px;min-width:0}
.stats > div > span{display:block;color:var(--muted);font-size:13px}
.stats b{font-size:18px;font-weight:700}
.stats .bad{color:var(--bad)} .stats .warn{color:var(--warn)} .stats .good{color:var(--good)}

/* ---------- inventory ---------- */
.qty{text-align:left;min-width:74px}

/* ================= helpers ================= */

function fail(e){
  const c = e && e.code;
  toast(c === 'quota_exceeded' ? 'امتلأت مساحة الحفظ. احذف بيانات قديمة ثم أعد المحاولة.' : 'لم يتم الحفظ. تحقق من الاتصال وأعد المحاولة.', true);
}
/* Writes go out immediately; only writes to the SAME document wait for each other.
   Until a write is confirmed, its result is laid over incoming snapshots so the screen never jumps back. */
const pend = {}, docQ = {};
function commit(path, next, op){
  const token = {}; pend[path] = {v:next, token};
  const p = (docQ[path] || Promise.resolve())
    .then(op)
    .then(() => true, e => { fail(e); return false; })
    .then(ok => { if (pend[path] && pend[path].token === token) delete pend[path]; return ok; });
  docQ[path] = p; return p;
}
const put = (path, data) => commit(path, data, () => db.doc(path).set(data));
const upd = (path, patch, full) => commit(path, full, () => db.doc(path).update(patch));
const del = path => commit(path, null, () => db.doc(path).delete());
function overlay(col, o){
  const pre = col + '/';
  for (const p in pend){
    if (!p.startsWith(pre)) continue;
    const id = p.slice(pre.length); if (id.includes('/')) continue;
    if (pend[p].v === null) delete o[id]; else o[id] = pend[p].v;
  }
  return o;
}

function onErr(e){ if (e && (e.code === 'revoked' || e.code === 'not_granted')) { S.offline = true; queueRender(); } }
function subCol(key, q, cov){
  return q.onSnapshot(snap => {
    if (cov) S.cov[key] = cov;
    const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); });
    S[key] = overlay(key, o); S.loaded.add(key); queueRender();
  }, onErr);
}
function subMonth(){
  unsubMonth.forEach(u => u()); unsubMonth = [];
  const wEnd = dayKey(addDays(dateOf(S.week), 6));
  const months = [...new Set([S.cur, shiftMonth(S.cur, -1), S.month, S.week.slice(0, 7), wEnd.slice(0, 7), S.attDate.slice(0, 7)])];
  S.cov = {};
  ['sales','expenses','sched','att','shawarma','kfc','drinklog'].forEach(k => unsubMonth.push(subCol(k, db.collection(k).where('month', 'in', months), months)));
  subPay();
}
const payKey = () => S.payMode === 'week' ? 'w-' + S.week : S.month;
function subPay(){
  if (unsubPay) unsubPay();
  const pk = payKey(), path = 'payroll/' + pk;
  S.payrollFor = null; S.payroll = null;
  unsubPay = db.doc(path).onSnapshot(d => {

    S.payroll = pend[path] ? pend[path].v : (d.exists ? d.data() : null);
    S.payrollFor = pk; S.loaded.add('payroll'); queueRender();
  }, onErr);
}

function homeView(){
  const today = dayKey(), tk = todayDayKey();
  const tOrders = ordersOfDay(today);
  const tSales = sum(tOrders, o => o.total);
  const tExp = sum(Object.values(S.expenses).filter(e => e.date === today), e => e.amount);
  const mSales = sum(ordersOfMonth(S.cur), o => o.total);
  const mExp = sum(expOfMonth(S.cur), ([, e]) => e.amount);
  const days = [];
  for (let i = 6; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const k = dayKey(d); days.push({k, v: sum(ordersOfDay(k), o => o.total), wd: DAYNAME[JSDAY[d.getDay()]]}); }
  const maxV = Math.max(1, ...days.map(d => d.v));
  const low = sortByName(S.items).filter(([, it]) => statusOf(it) !== 'ok').sort((a, b) => (statusOf(a[1]) === 'out' ? 0 : 1) - (statusOf(b[1]) === 'out' ? 0 : 1));
  const shift = sortByName(S.staff).map(([id, s]) => [id, s, effShift(s, id, today)]).filter(x => x[2] !== 'off');

function monthSchedView(staff){

const weekNav = () => {
  const [a, b] = periodRange();
  return `<div class="monthnav weeknav"><button class="icon-btn" data-act="week" data-d="-1" aria-label="الأسبوع السابق">${ic('prev')}</button><strong>${dayLabel(a, false)} – ${dayLabel(b, false)}</strong><button class="icon-btn" data-act="week" data-d="1" aria-label="الأسبوع التالي" ${S.week >= weekStart() ? 'disabled' : ''}>${ic('next')}</button></div>`;

function payView(all){
  const kind = S.payMode;
  const pm = (k, l) => `<button data-act="paymode" data-m="${k}" aria-pressed="${kind === k}">${l}</button>`;
  const top = `<div class="sec-head" style="margin:0;flex-wrap:wrap"><div class="seg" role="group" aria-label="نوع الرواتب">${pm('month', 'شهري')}${pm('week', 'أسبوعي')}</div>${kind === 'week' ? weekNav() : monthNav()}</div>`;
  if (S.payrollFor !== payKey()) return top + `<div class="loading">جارٍ تحميل الرواتب…</div>`;

/* ---------- shawarma ----------
   One document per day: shawarma/YYYY-MM-DD {date, month, skewers:{id:{...}}}.
   Weights are stored in kg, money in IQD. Defaults per type live in settings/shawarma. */
const SH_TYPES = ['دجاج','لحم'];
const skewersOf = d => Object.entries((d && d.skewers) || {}).filter(([, x]) => x);
const shDefaults = () => (S.settings.shawarma && S.settings.shawarma.types) || {};
const shTypeNames = () => [...new Set([...SH_TYPES, ...Object.keys(shDefaults()), ...Object.values(S.shawarma).flatMap(d => skewersOf(d).map(([, x]) => x.type))].filter(Boolean))];
const kgOf = (it, kg) => it && it.unit === 'غرام' ? kg * 1000 : kg;
const fmtKgT = kg => { kg = +kg || 0; return Math.abs(kg) < 1 && kg !== 0 ? fmt(kg * 1000) + ' غ' : fmtQ(kg) + ' كغم'; };
const fmtKg = kg => { kg = +kg || 0; return Math.abs(kg) < 1 && kg !== 0 ? NUM(fmt(kg * 1000)) + ' غ' : NUM(fmtQ(kg)) + ' كغم'; };
const lafa = n => { n = Math.round(+n || 0); const w = n === 1 ? 'لفة' : n === 2 ? 'لفتين' : n >= 3 && n <= 10 ? 'لفات' : 'لفة'; return n === 2 ? w : NUM(fmt(n)) + ' ' + w; };
const matCost = r => (r.c != null ? +r.c : (S.items[r.i] ? +S.items[r.i].cost || 0 : 0)) * (+r.q || 0);
function shCalc(x){
  const w = +x.w || 0, wraps = +x.wraps || 0, staff = +x.staff || 0, gpw = +x.gpw || 0, pz = +x.pz || 0, left = Math.min(+x.left || 0, w);
  const meat = w * (+x.kgp || 0);
  const mats = sum(x.mats || [], matCost) + (+x.other || 0);
  const base = meat + mats;                                   // what the whole skewer cost
  const wrapsKg = wraps * gpw / 1000, staffKg = staff * gpw / 1000;     // staff dinner wraps: cost, no income
  const served = wrapsKg + staffKg + pz;
  const loss = Math.max(0, w - served - left);                // shrinkage + waste
  const over = Math.max(0, served + left - w);
  const usedBase = w > 0 ? base * (w - left) / w : 0;         // the leftover carries its share to tomorrow
  const kgCost = served > 0 ? usedBase / served : (w > 0 ? base / w : 0);
  const pzp = +x.pzp > 0 ? +x.pzp : kgCost;                   // no price for the pizza → hand it over at cost
  const wrapsRev = wraps * (+x.price || 0), pzRev = pz * pzp;
  const extras = (wraps + staff) * (+x.extra || 0);
  const cost = usedBase + extras, rev = wrapsRev + pzRev;
  const wrapCost = kgCost * gpw / 1000 + (+x.extra || 0);
  return {w, wraps, staff, staffKg, staffCost: kgCost * staffKg + staff * (+x.extra || 0), gpw, pz, left, meat, mats, base, wrapsKg, served, loss, over, lossPct: w ? loss / w * 100 : 0,
    cost, rev, profit: rev - cost, wrapCost, kgCost, pzp, pzRev, wrapsRev, open: !wraps && !pz && !staff};
}
/* average real loss of finished skewers of this type, so the estimate learns from the restaurant's own numbers */
function avgLoss(type, skip){
  const xs = Object.values(S.shawarma).flatMap(d => skewersOf(d)).filter(([id, x]) => id !== skip && x.type === type && +x.wraps > 0).map(([, x]) => shCalc(x)).filter(c => c.w > 0 && !c.over && c.lossPct <= 60);
  return xs.length ? {pct: sum(xs, c => c.lossPct) / xs.length, n: xs.length} : null;
}
function shExpect(x, c, exl){
  const net = c.w * (1 - exl / 100) - c.pz - c.left;
  const wraps = c.gpw > 0 ? Math.max(0, Math.floor(net * 1000 / c.gpw)) : 0;
  return {wraps, worth: wraps * (+x.price || 0) + c.pzRev, gap: c.open ? 0 : wraps - c.wraps - c.staff};
}
const shExl = (x, skip) => { if (x.exl !== '' && x.exl != null && isFinite(+x.exl)) return +x.exl; const a = avgLoss(x.type, skip); return a ? Math.round(a.pct) : 30; };

function skCard(r){
  const {x, c} = r, tot = Math.max(c.w, c.served + c.left) || 1;
  const segs = [['seg-w', c.wrapsKg], ['seg-s', c.staffKg], ['seg-p', c.pz], ['seg-l', c.left], ['seg-x', c.loss]].filter(s => s[1] > 0);
  const ex = shExpect(x, c, shExl(x, r.id));
  return `<article class="sk" data-act="edit-sk" data-id="${esc(r.id)}" data-date="${esc(r.date)}">
    <div class="sk-top"><span class="av av1">${ic('shawarma')}</span>
      <div class="li-main"><div class="li-title">شيش ${esc(x.type)} · ${fmtKg(c.w)}</div>
        <div class="li-meta">${c.open ? 'المتوقع ' + lafa(ex.wraps) : lafa(c.wraps) + ' × ' + NUM(fmt(c.gpw)) + ' غ'}${x.note ? ' · ' + esc(x.note) : ''}</div></div>
      ${c.open ? '<span class="pill low">على الشيش</span>' : c.over ? '<span class="pill out">الأوزان أكثر من الشيش</span>' : `<span class="pill plain ${c.lossPct > 40 ? 'out' : c.lossPct > 32 ? 'low' : 'ok'}">فقد ${NUM(Math.round(c.lossPct) + '%')}</span>`}
      <button class="icon-btn" data-act="edit-sk" data-id="${esc(r.id)}" data-date="${esc(r.date)}" aria-label="تعديل">${ic('edit')}</button></div>
    ${c.w ? `<div class="sk-bar" aria-hidden="true">${segs.map(([k, v]) => `<i class="${k}" style="width:${v / tot * 100}%"></i>`).join('')}</div>
    <div class="sk-legend">${c.wrapsKg ? `<span><i class="seg-w"></i>لفات ${fmtKg(c.wrapsKg)}</span>` : ''}${c.staff ? `<span><i class="seg-s"></i>العمال ${lafa(c.staff)}</span>` : ''}${c.pz ? `<span><i class="seg-p"></i>البيتزا ${fmtKg(c.pz)}</span>` : ''}${c.left ? `<span><i class="seg-l"></i>باقي ${fmtKg(c.left)}</span>` : ''}${c.loss && !c.open ? `<span><i class="seg-x"></i>فقد ${fmtKg(c.loss)}</span>` : ''}</div>` : ''}
    ${!c.open && ex.gap > 0 ? `<div class="warn-note">حسب الوزن كان المفروض ${lafa(ex.wraps)}، يعني ناقص ${lafa(ex.gap)} ≈ ${IQD(ex.gap * (+x.price || 0))}</div>` : ''}
    <div class="sk-money"><div><span>${c.open ? 'يسوى تقريباً' : 'الإيراد'}</span><b>${IQD(c.open ? ex.worth : c.rev)}</b></div><div><span>التكلفة</span><b>${IQD(c.open ? c.base : c.cost)}</b></div>
      <div><span>${c.open ? 'كلفة اللفة' : 'الربح'}</span><b class="${c.open ? '' : c.profit < 0 ? 'neg-v' : 'pos-v'}">${IQD(c.open ? c.wrapCost : c.profit)}</b></div></div>
  </article>`;
}

function shawarmaView(){
  const days = Object.values(S.shawarma).filter(d => d && d.month === S.month && d.date).sort((a, b) => b.date.localeCompare(a.date));

  const list = all.filter(r => S.shType === 'all' || r.x.type === S.shType);
  const done = list.filter(r => !r.c.open);
  const T = f => sum(done, r => f(r.c));
  const lossAvg = done.filter(r => r.c.w).length ? sum(done.filter(r => r.c.w), r => r.c.lossPct) / done.filter(r => r.c.w).length : 0;
  const f = (k, l) => `<button class="chip" data-act="sk-type" data-t="${esc(k)}" aria-pressed="${S.shType === k}">${esc(l)}</button>`;
  const groups = {}; list.forEach(r => { (groups[r.date] = groups[r.date] || []).push(r); });
  const top = head('الشاورما', 'الوزن واللفات وحصة البيتزا والربح', `<button class="btn btn-primary" data-act="add-sk">${ic('plus')} شيش جديد</button>`);

    <span>سجّل وزن الشيش وسعره ومواده، وبآخر اليوم اكتب عدد اللفات وكم راح لأبو البيتزا. التطبيق يحسب الكلفة والربح والفقد، وكم لفة كان المفروض يطلع منه.</span>
    <button class="btn btn-primary" data-act="add-sk">${ic('plus')} سجّل أول شيش</button></div>`;
  const byType = types.map(t => { const xs = all.filter(r => r.x.type === t && !r.c.open); return {t, n:all.filter(r => r.x.type === t).length, xs}; });
  return top + `
  <div class="sec-head" style="margin:0;flex-wrap:wrap">${monthNav()}${types.length > 1 ? `<div class="chips">${f('all', 'الكل')}${types.map(t => f(t, t)).join('')}</div>` : ''}</div>
  <section class="hero" aria-label="ملخص الشهر">

function skWrite(date, sid, data){
  const cur = S.shawarma[date], path = 'shawarma/' + date;
  let body, p;
  if (cur && cur.skewers){
    body = Object.assign({}, cur, {skewers:Object.assign({}, cur.skewers, {[sid]:data})});
    p = upd(path, {skewers:{[sid]:data}}, body);
  } else {
    if (!data) return Promise.resolve(true);
    body = {date, month:date.slice(0, 7), skewers:{[sid]:data}};
    p = put(path, body);
  }
  S.shawarma = Object.assign({}, S.shawarma, {[date]:body});
  return p;
}
function saveShDefaults(y){
  const d = {gpw:y.gpw, price:y.price, extra:y.extra, pzp:y.pzp, kgp:y.kgp, item:y.item, mats:y.mats.map(r => ({i:r.i, q:r.q})), other:y.other, exl:y.exl};
  const cur = S.settings.shawarma;
  const full = {types:Object.assign({}, (cur && cur.types) || {}, {[y.type]:d}), last:y.type};
  S.settings = Object.assign({}, S.settings, {shawarma:full});
  return cur ? upd('settings/shawarma', {types:{[y.type]:d}, last:y.type}, full) : put('settings/shawarma', full);

/* ---------- KFC ----------
   One document per day: kfc/YYYY-MM-DD {date, month, batches:{id:{...}}}.
   Chicken is bought by the kg and cut into pieces; it is sold as meals of N pieces (types in settings/kfc).
   Each batch keeps a snapshot of the meals it sold, so later price changes don't rewrite history. */
const kfcSet = () => S.settings.kfc || {};
const kfcMeals = () => Object.entries(kfcSet().meals || {}).filter(([, m]) => m && m.name).sort((a, b) => (+a[1].pcs || 0) - (+b[1].pcs || 0));
const batchesOf = d => Object.entries((d && d.batches) || {}).filter(([, x]) => x);
const pcsW = n => { n = Math.round(+n || 0); return n === 1 ? 'قطعة' : n === 2 ? 'قطعتين' : NUM(fmt(n)) + (n >= 3 && n <= 10 ? ' قطع' : ' قطعة'); };
function kfcCalc(x){
  const w = +x.w || 0, pcs = Math.round(+x.pcs || 0), staff = +x.staff || 0, left = Math.min(+x.left || 0, pcs);
  const sold = toArr(x.sold).filter(m => +m.n > 0);
  const meals = sum(sold, m => m.n), soldPcs = sum(sold, m => m.n * m.pcs);
  const meat = w * (+x.kgp || 0), mats = sum(x.mats || [], matCost) + (+x.other || 0), base = meat + mats;
  const pcCost = pcs > 0 ? base / pcs : 0;
  const extras = sum(sold, m => m.n * (+m.extra || 0));
  const rev = sum(sold, m => m.n * (+m.price || 0));
  const cost = pcCost * (pcs - left) + extras;               // leftover pieces carry their cost to the next batch
  const missing = pcs - soldPcs - staff - left;              // > 0: pieces nobody accounted for
  const pcPrice = soldPcs ? rev / soldPcs : 0;
  return {w, pcs, staff, left, sold, meals, soldPcs, meat, mats, base, pcCost, extras, rev, cost, profit: rev - cost,
    missing, pcPrice, staffCost: staff * pcCost, yield: w ? pcs / w : 0, open: !meals && !staff};
}
function avgYield(skip){
  const xs = Object.values(S.kfc).flatMap(d => batchesOf(d)).filter(([id, x]) => id !== skip && +x.w > 0 && +x.pcs > 0).map(([, x]) => x.pcs / x.w);
  return xs.length ? {v: sum(xs, v => v) / xs.length, n: xs.length} : null;
}
function kfcCard(r){
  const {x, c} = r, tot = Math.max(c.pcs, c.soldPcs + c.staff + c.left) || 1;
  const segs = [['seg-w', c.soldPcs], ['seg-s', c.staff], ['seg-l', c.left], ['seg-x', Math.max(0, c.missing)]].filter(s => s[1] > 0);
  return `<article class="sk" data-act="edit-kfc" data-id="${esc(r.id)}" data-date="${esc(r.date)}">
    <div class="sk-top"><span class="av av3">${ic('kfc')}</span>
      <div class="li-main"><div class="li-title">دفعة ${+x.hens ? NUM(fmt(x.hens)) + ' دجاجة · ' : ''}${fmtKg(c.w)} · ${pcsW(c.pcs)}</div>
        <div class="li-meta">${c.open ? 'كلفة القطعة ' + fmt(c.pcCost) + ' د.ع' : c.sold.map(m => esc(m.name) + ' ×' + m.n).join('، ')}${x.note ? ' · ' + esc(x.note) : ''}</div></div>
      ${c.open ? '<span class="pill low">بالقلي</span>' : c.missing > 0 ? `<span class="pill out">ناقص ${pcsW(c.missing)}</span>` : c.missing < 0 ? '<span class="pill out">المباع أكثر من القطع</span>' : '<span class="pill ok">مضبوطة</span>'}
      <button class="icon-btn" data-act="edit-kfc" data-id="${esc(r.id)}" data-date="${esc(r.date)}" aria-label="تعديل">${ic('edit')}</button></div>
    ${c.pcs ? `<div class="sk-bar" aria-hidden="true">${segs.map(([k, v]) => `<i class="${k}" style="width:${v / tot * 100}%"></i>`).join('')}</div>
    <div class="sk-legend">${c.soldPcs ? `<span><i class="seg-w"></i>مباع ${pcsW(c.soldPcs)}</span>` : ''}${c.staff ? `<span><i class="seg-s"></i>العمال ${pcsW(c.staff)}</span>` : ''}${c.left ? `<span><i class="seg-l"></i>باقي ${pcsW(c.left)}</span>` : ''}${c.missing > 0 && !c.open ? `<span><i class="seg-x"></i>ناقص ${pcsW(c.missing)}</span>` : ''}</div>` : ''}
    ${!c.open && c.missing > 0 && c.pcPrice ? `<div class="warn-note">${pcsW(c.missing)} بدون حساب ≈ ${IQD(c.missing * c.pcPrice)} بسعر البيع</div>` : ''}
    <div class="sk-money"><div><span>${c.open ? 'الوجبات' : 'الإيراد'}</span><b>${c.open ? '—' : IQD(c.rev)}</b></div><div><span>التكلفة</span><b>${IQD(c.open ? c.base : c.cost)}</b></div>
      <div><span>${c.open ? 'كلفة القطعة' : 'الربح'}</span><b class="${c.open ? '' : c.profit < 0 ? 'neg-v' : 'pos-v'}">${IQD(c.open ? c.pcCost : c.profit)}</b></div></div>
  </article>`;
}
function kfcView(){
  const days = Object.values(S.kfc).filter(d => d && d.month === S.month && d.date).sort((a, b) => b.date.localeCompare(a.date));
  const all = days.flatMap(d => batchesOf(d).map(([id, x]) => ({id, x, date:d.date, c:kfcCalc(x)}))).sort((a, b) => (b.x.t || 0) - (a.x.t || 0));
  const done = all.filter(r => !r.c.open), T = f => sum(done, r => f(r.c));
  const meals = kfcMeals();
  const top = head('الكنتاكي', 'الدجاج بالكيلو، القطع، والوجبات', `<div class="chips"><button class="btn" data-act="kfc-meals">${ic('meal')} الوجبات والأسعار</button><button class="btn btn-primary" data-act="add-kfc">${ic('plus')} دفعة جديدة</button></div>`);
  const setup = !meals.length ? `<div class="banner"><p>أولاً حدّد <b>وجباتك</b>: كم قطعة بكل وجبة وسعرها، مثل وجبة 2 قطع، 4 قطع، بوكس عائلي.</p><button class="btn btn-sm btn-primary" data-act="kfc-meals">تحديد الوجبات</button></div>` : '';
  if (!all.length) return top + setup + `<div>${monthNav()}</div><div class="panel empty"><span class="av av3" style="width:56px;height:56px;border-radius:16px">${ic('kfc')}</span><strong>لا توجد دفعات كنتاكي في ${monthLabel(S.month)}</strong>
    <span>سجّل وزن الدجاج وسعره ومواد التتبيلة والزيت، وكم قطعة طلعت. وبآخر اليوم اكتب عدد كل وجبة وقطع العمال، فيحسب لك الربح وكلفة القطعة ويكشف أي قطع ناقصة.</span>
    <button class="btn btn-primary" data-act="add-kfc">${ic('plus')} سجّل أول دفعة</button></div>`;
  const byMeal = {}; done.forEach(r => r.c.sold.forEach(m => { const k = m.name; byMeal[k] = byMeal[k] || {n:0, rev:0, pcs:m.pcs}; byMeal[k].n += m.n; byMeal[k].rev += m.n * m.price; }));
  const bm = Object.entries(byMeal).sort((a, b) => b[1].n - a[1].n), mx = Math.max(1, ...bm.map(([, v]) => v.n));
  const groups = {}; all.forEach(r => { (groups[r.date] = groups[r.date] || []).push(r); });
  const miss = T(c => Math.max(0, c.missing));
  return top + setup + `
  <div>${monthNav()}</div>
  <section class="hero" aria-label="ملخص الشهر">
    <div><div class="lbl">ربح الكنتاكي · ${monthLabel(S.month)}</div><div class="big">${IQD(T(c => c.profit))}</div>
      <div class="hero-stats" style="margin-top:14px"><div><span class="lbl">الإيراد</span><b>${IQD(T(c => c.rev))}</b></div><div><span class="lbl">التكلفة</span><b>${IQD(T(c => c.cost))}</b></div><div><span class="lbl">الوجبات</span><b>${NUM(fmt(T(c => c.meals)))}</b></div></div></div>
    <div class="hero-stats"><div><span class="lbl">الدفعات</span><b>${NUM(all.length)}</b></div><div><span class="lbl">الدجاج</span><b>${fmtKg(sum(all, r => r.c.w))}</b></div><div><span class="lbl">القطع</span><b>${NUM(fmt(sum(all, r => r.c.pcs)))}</b></div>
      <div><span class="lbl">قطعة لكل كيلو</span><b>${NUM(fmtQ(sum(all, r => r.c.w) ? sum(all, r => r.c.pcs) / sum(all, r => r.c.w) : 0))}</b></div><div><span class="lbl">قطع العمال</span><b>${NUM(fmt(T(c => c.staff)))} <span class="cur">· ${fmt(T(c => c.staffCost))} د.ع</span></b></div><div><span class="lbl">قطع ناقصة</span><b>${NUM(fmt(miss))}</b></div></div>
  </section>
  ${bm.length ? `<section><div class="sec-head"><h2>${ic('meal')} الأكثر مبيعاً</h2><span class="muted">${monthLabel(S.month)}</span></div><div class="panel pad cats">${bm.map(([n, v]) => `<div class="cat-row"><span>${esc(n)}</span><div class="cat-track"><i style="width:${v.n / mx * 100}%"></i></div><span>${NUM(fmt(v.n))} · ${IQD(v.rev)}</span></div>`).join('')}</div></section>` : ''}
  ${Object.entries(groups).map(([d, rs]) => `<section><div class="sec-head"><h2>${d === dayKey() ? 'اليوم · ' : ''}${dayLabel(d)}</h2><span class="muted">${rs.some(r => !r.c.open) ? 'الربح ' + fmt(sum(rs.filter(r => !r.c.open), r => r.c.profit)) + ' د.ع' : ''}</span></div>
    <div class="sk-list">${rs.map(kfcCard).join('')}</div></section>`).join('')}`;
}

function openKfcMeals(){
  const rows = kfcMeals();
  const row = (id, m) => `<div class="meal-row" data-id="${esc(id || '')}"><input class="m-name" maxlength="30" value="${esc(m ? m.name : '')}" placeholder="اسم الوجبة" aria-label="اسم الوجبة"><input class="m-pcs" inputmode="numeric" value="${m ? m.pcs : ''}" placeholder="قطع" aria-label="عدد القطع"><input class="m-price" inputmode="numeric" value="${m && +m.price ? m.price : ''}" placeholder="السعر" aria-label="السعر"><input class="m-extra" inputmode="numeric" value="${m && +m.extra ? m.extra : ''}" placeholder="إضافات" aria-label="كلفة الإضافات"><button type="button" class="icon-btn m-del" aria-label="حذف الوجبة">${ic('x')}</button></div>`;
  const seed = [['وجبة 2 قطع', 2], ['وجبة 4 قطع', 4], ['بوكس عائلي 8 قطع', 8]];
  openSheet('الوجبات والأسعار', `<form class="form" novalidate>
    <p class="hint">لكل وجبة: عدد القطع، سعر البيع، وكلفة الإضافات للوجبة الواحدة (بطاطا، خبز، صوص، علبة).</p>
    <div class="meal-head"><span>الوجبة</span><span>قطع</span><span>السعر</span><span>إضافات</span><span></span></div>
    <div id="meals" class="recipe">${rows.length ? rows.map(([id, m]) => row(id, m)).join('') : seed.map(([n, p]) => row('', {name:n, pcs:p})).join('')}</div>
    <button type="button" class="btn btn-sm" id="meal-add" style="justify-self:start">${ic('plus')} وجبة</button>
    ${formActions()}</form>`, body => {
    const box = body.querySelector('#meals');
    body.querySelector('#meal-add').addEventListener('click', () => box.insertAdjacentHTML('beforeend', row('', null)));
    box.addEventListener('click', e => { const b = e.target.closest('.m-del'); if (b) b.closest('.meal-row').remove(); });
    bindForm(body, async f => {
      const meals = {};
      for (const r of box.querySelectorAll('.meal-row')){
        const name = r.querySelector('.m-name').value.trim(), pcs = Math.round(num(r.querySelector('.m-pcs').value)), price = Math.round(num(r.querySelector('.m-price').value));
        if (!name && !pcs && !price) continue;
        if (!name) return setErr(f, 'اكتب اسم كل وجبة.');
        if (pcs <= 0) return setErr(f, 'اكتب عدد القطع في ' + name + '.');
        if (price <= 0) return setErr(f, 'اكتب سعر ' + name + '.');
        meals[r.dataset.id || uid()] = {name, pcs, price, extra:Math.round(num(r.querySelector('.m-extra').value))};
      }
      if (!Object.keys(meals).length) return setErr(f, 'أضف وجبة واحدة على الأقل.');
      const removed = Object.fromEntries(Object.keys(kfcSet().meals || {}).filter(k => !meals[k]).map(k => [k, null]));
      const cur = S.settings.kfc, full = Object.assign({}, cur || {}, {meals});
      closeSheet(); S.settings = Object.assign({}, S.settings, {kfc:full}); render();
      if (await (cur ? upd('settings/kfc', {meals:Object.assign({}, removed, meals)}, full) : put('settings/kfc', full))) toast('تم حفظ الوجبات');
    });
  });
}

function openKfc(id, date){
  const old = id && S.kfc[date] && S.kfc[date].batches && S.kfc[date].batches[id];
  if (id && !old) return;
  const meals = kfcMeals();
  if (!meals.length && !old){ openKfcMeals(); toast('حدّد الوجبات وأسعارها أولاً'); return; }
  const st = kfcSet();
  const x = old ? Object.assign({mats:[], sold:[], hens:'', per:''}, old) : {w:'', kgp:st.kgp || '', item:st.item || '', mats:st.mats || [], other:st.other || '', hens:'', per:st.per || '', pcs:'', sold:[], staff:'', left:'', note:''};
  const soldBy = {}; toArr(x.sold).forEach(m => { soldBy[m.id] = m; });
  /* meals shown: current types (with any price kept from this batch's snapshot), plus snapshot meals that were since deleted */
  const list = [...meals.map(([mid, m]) => Object.assign({id:mid}, m, soldBy[mid] ? {price:soldBy[mid].price, extra:soldBy[mid].extra, pcs:soldBy[mid].pcs} : {})),
    ...toArr(x.sold).filter(m => !meals.some(([mid]) => mid === m.id))];
  const d0 = old ? date : (S.month === S.cur ? dayKey() : S.month + '-01');
  const minM = [S.month, shiftMonth(S.cur, -1)].sort()[0];
  const items = sortByName(S.items), hasItems = items.length > 0;
  const v = n => (n === '' || n == null || !+n) ? '' : fmtQ(n);
  const stocked = old ? Object.keys(old.stk || {}).length > 0 : true;
  openSheet(old ? 'تعديل دفعة كنتاكي' : 'دفعة كنتاكي جديدة', `<form class="form" novalidate>
    ${old ? '' : `<div class="steps"><div><i>1</i><span><b>الآن:</b> وزن الدجاج وسعره، وعدد الدجاجات وكم قطعة تقطّع كل دجاجة، ثم احفظ.</span></div><div><i>2</i><span><b>آخر اليوم:</b> افتح نفس الدفعة واكتب كم وجبة بعت من كل نوع، وقطع العمال والباقي.</span></div><div><i>3</i><span>التطبيق يحسب كلفة القطعة والربح، ويقول لك إذا في قطع ناقصة.</span></div></div>`}
    <div class="fsec"><b>${ic('kfc')} الدجاج</b>
      <div class="row2"><label>وزن الدجاج (كغم)<input id="f-w" inputmode="decimal" value="${v(x.w)}" placeholder="مثال: 10"></label>
        <label>سعر الكيلو (د.ع)<input id="f-kgp" inputmode="numeric" value="${v(x.kgp)}" placeholder="0"></label></div>
      <div class="row3"><label>عدد الدجاجات<input id="f-hens" inputmode="numeric" value="${v(x.hens)}" placeholder="مثال: 10"></label>
        <label>قطع الدجاجة الواحدة<input id="f-per" inputmode="numeric" value="${v(x.per)}" placeholder="مثال: 8"></label>
        <label>العدد الكلي للقطع<input id="f-pcs" inputmode="numeric" value="${v(x.pcs)}" placeholder="يُحسب وحده"></label></div>
      <p class="hint" id="yield-hint" style="margin-top:-4px"></p>
      <label>التاريخ<input id="f-date" type="date" value="${d0}" min="${minM}-01" max="${dayKey()}"></label>
      ${hasItems ? `<label>الدجاج من المخزون<select id="f-item"><option value="">بدون، لا تخصم من المخزون</option>${items.map(([iid, it]) => `<option value="${iid}" ${x.item === iid ? 'selected' : ''}>${esc(it.name)} (${esc(it.unit)})</option>`).join('')}</select></label>` : ''}
    </div>
    <div class="fsec"><b>${ic('leaf')} التتبيلة والطحين والزيت</b>
      ${hasItems ? `<div class="recipe" id="mats">${(x.mats || []).filter(r => S.items[r.i]).map(recipeRow).join('')}</div><button type="button" class="btn btn-sm" id="m-add" style="justify-self:start">${ic('plus')} مادة من المخزون</button>` : ''}
      <label>مواد أخرى (د.ع)<input id="f-other" inputmode="numeric" value="${v(x.other)}" placeholder="زيت، طحين، بهارات، غاز…"><small>كلفة المواد غير المسجّلة في المخزون، للدفعة كلها</small></label>
    </div>
    <div class="fsec"><b>${ic('meal')} الوجبات المباعة</b>
      <div class="meal-sold">${list.map(m => `<div class="ms-row" data-mid="${esc(m.id)}" data-pcs="${m.pcs}" data-price="${m.price}" data-extra="${+m.extra || 0}" data-name="${esc(m.name)}">
        <div class="li-main"><div class="li-title">${esc(m.name)}</div><div class="li-meta">${pcsW(m.pcs)} · ${IQD(m.price)}</div></div>
        <div class="stepper"><button type="button" data-step="-1" aria-label="إنقاص">−</button><input class="ms-n" inputmode="numeric" value="${soldBy[m.id] ? soldBy[m.id].n : ''}" placeholder="0" aria-label="عدد ${esc(m.name)}"><button type="button" data-step="1" aria-label="زيادة">+</button></div></div>`).join('')}</div>
      <div class="row2"><label>قطع العمال (عشاء)<input id="f-staff" inputmode="numeric" value="${v(x.staff)}" placeholder="0"><small>كلفة بدون إيراد</small></label>
        <label>القطع الباقية<input id="f-left" inputmode="numeric" value="${v(x.left)}" placeholder="0"><small>تنتقل لليوم الثاني</small></label></div>
      <label>ملاحظة<input id="f-note" maxlength="80" value="${esc(x.note || '')}" placeholder="اختياري"></label>
      ${hasItems ? `<label class="check"><input type="checkbox" id="f-stock" ${stocked ? 'checked' : ''}> اخصم الدجاج والمواد من المخزون</label>` : ''}
    </div>
    <div class="sk-calc"><div class="sk-hint" id="sk-hint"></div><div class="calc" id="calc"></div></div>
    ${formActions(old ? 'حذف الدفعة' : '')}</form>`, body => {
    const $f = s => body.querySelector(s), mats = $f('#mats');
    const readMats = () => mats ? [...mats.querySelectorAll('.rrow')].map(r => ({i:r.querySelector('.r-i').value, q:round(num(r.querySelector('.r-q').value))})).filter(r => r.i && r.q > 0)
      .map(r => { const o = (old && old.mats || []).find(m => m.i === r.i); return Object.assign(r, {c: o && o.c != null ? o.c : Math.round(+S.items[r.i].cost || 0)}); }) : [];
    const read = () => ({w:round(num($f('#f-w').value)), kgp:Math.round(num($f('#f-kgp').value)), item:$f('#f-item') ? $f('#f-item').value : '', mats:readMats(), other:Math.round(num($f('#f-other').value)),
      hens:Math.round(num($f('#f-hens').value)), per:Math.round(num($f('#f-per').value)), pcs:Math.round(num($f('#f-pcs').value)), staff:Math.round(num($f('#f-staff').value)), left:Math.round(num($f('#f-left').value)), note:$f('#f-note').value.trim(),
      sold:[...body.querySelectorAll('.ms-row')].map(r => ({id:r.dataset.mid, name:r.dataset.name, pcs:+r.dataset.pcs, price:+r.dataset.price, extra:+r.dataset.extra, n:Math.round(num(r.querySelector('.ms-n').value))})).filter(m => m.n > 0)});
    const calc = () => {
      const y = read(), c = kfcCalc(y), a = avgYield(id);
      $f('#yield-hint').innerHTML = y.hens && y.per ? `${NUM(fmt(y.hens))} دجاجة × ${pcsW(y.per)} = <b>${pcsW(y.hens * y.per)}</b>${y.w ? ' · وزن الدجاجة تقريباً ' + fmtKg(y.w / y.hens) : ''}`
        : 'اكتب عدد الدجاجات وقطع كل دجاجة، أو اكتب العدد الكلي مباشرة' + (a && y.w ? ' (حسب معدلك يطلع تقريباً ' + fmt(a.v * y.w) + ' قطعة)' : '') + '.';
      $f('#sk-hint').innerHTML = !c.w ? 'اكتب وزن الدجاج حتى تظهر الحسبة.' : !c.pcs ? `الدفعة كلّفت ${IQD(c.base)}. اكتب عدد القطع حتى أحسب كلفة القطعة.`
        : `كل قطعة كلّفت <b>${IQD(c.pcCost)}</b>، و${NUM(fmtQ(c.yield))} ${Math.round(c.yield) >= 3 && Math.round(c.yield) <= 10 && c.yield % 1 === 0 ? 'قطع' : 'قطعة'} لكل كيلو.`
          + (c.open ? '' : c.missing > 0 ? `<br>المباع ${pcsW(c.soldPcs)}${c.staff ? ' + ' + pcsW(c.staff) + ' للعمال' : ''}${c.left ? ' + ' + pcsW(c.left) + ' باقية' : ''}، يعني <b style="color:var(--bad)">ناقص ${pcsW(c.missing)}${c.pcPrice ? ' ≈ ' + IQD(c.missing * c.pcPrice) : ''}</b>.`
            : c.missing < 0 ? `<br><span style="color:var(--bad)">القطع المباعة أكثر من قطع الدفعة بـ ${pcsW(-c.missing)}. راجع الأرقام.</span>` : '<br>كل القطع محسوبة ✓');
      $f('#calc').innerHTML = `<div><span>التكلفة</span><b>${IQD(c.open ? c.base : c.cost)}</b></div><div><span>الإيراد</span><b>${IQD(c.rev)}</b></div><div><span>الربح</span><b class="${c.profit < 0 && !c.open ? 'neg-v' : 'pos-v'}">${c.open ? '—' : IQD(c.profit)}</b></div>
        <div><span>الوجبات</span><b>${NUM(fmt(c.meals))}</b></div><div><span>كلفة القطعة</span><b>${IQD(c.pcCost)}</b></div><div><span>عشاء العمال</span><b>${IQD(c.staffCost)}</b></div>`;
    };
    if ($f('#f-item')) $f('#f-item').addEventListener('change', () => { const it = S.items[$f('#f-item').value]; if (it && +it.cost && !num($f('#f-kgp').value)) $f('#f-kgp').value = Math.round(it.unit === 'غرام' ? it.cost * 1000 : it.cost); calc(); });
    if (mats){
      $f('#m-add').addEventListener('click', () => { mats.insertAdjacentHTML('beforeend', recipeRow(null)); calc(); });
      mats.addEventListener('click', e => { const b = e.target.closest('.r-del'); if (b){ b.closest('.rrow').remove(); calc(); } });
    }
    body.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (!b) return; const inp = b.parentElement.querySelector('.ms-n'); inp.value = Math.max(0, Math.round(num(inp.value)) + (+b.dataset.step)) || ''; calc(); });
    const autoPcs = () => { const h = Math.round(num($f('#f-hens').value)), pr = Math.round(num($f('#f-per').value)); if (h > 0 && pr > 0) $f('#f-pcs').value = h * pr; };
    $f('#f-hens').addEventListener('input', autoPcs); $f('#f-per').addEventListener('input', autoPcs);
    body.addEventListener('input', calc); body.addEventListener('change', calc);
    calc();
    bindForm(body, async f => {
      const y = read(), dt = $f('#f-date').value || dayKey();
      if (y.w <= 0) return setErr(f, 'اكتب وزن الدجاج بالكيلو.');
      if ((y.sold.length || y.staff) && y.pcs <= 0) return setErr(f, 'اكتب عدد القطع التي طلعت من الدجاج.');
      if (dt > dayKey()) return setErr(f, 'لا يمكن التسجيل بتاريخ قادم.');
      if (!covered('kfc', dt)) return setErr(f, 'اختر تاريخاً من هذا الشهر أو الشهر الذي قبله.');
      const bid = id || uid();
      const stk = {};
      if ($f('#f-stock') && $f('#f-stock').checked){ if (y.item && S.items[y.item]) stk[y.item] = round(kgOf(S.items[y.item], y.w)); y.mats.forEach(r => { stk[r.i] = round((stk[r.i] || 0) + r.q); }); }
      const data = Object.assign({}, y, {stk, t:(old && old.t) || Date.now(), by:myRole() || ''});
      closeSheet();
      const jobs = [];
      if (old && date !== dt) jobs.push(kfcWrite(date, bid, null));
      jobs.push(kfcWrite(dt, bid, data));
      const diff = {}, prev = (old && old.stk) || {};
      new Set([...Object.keys(stk), ...Object.keys(prev)]).forEach(k => { const dq = round((stk[k] || 0) - (prev[k] || 0)); if (dq) diff[k] = dq; });
      applyStock(diff, -1);
      const cur = S.settings.kfc, defs = {kgp:y.kgp, item:y.item, per:y.per, mats:y.mats.map(r => ({i:r.i, q:r.q})), other:y.other};
      const full = Object.assign({}, cur || {}, defs); S.settings = Object.assign({}, S.settings, {kfc:full});
      cur ? upd('settings/kfc', defs, full) : put('settings/kfc', full);
      if (dt.slice(0, 7) !== S.month){ S.month = dt.slice(0, 7); subMonth(); }
      render();
      if ((await Promise.all(jobs)).every(Boolean)){ const c = kfcCalc(data); toast(c.open ? 'تم حفظ الدفعة · ' + fmtKgT(y.w) : 'تم الحفظ · الربح ' + fmt(c.profit) + ' د.ع'); }
    });
    sheetDelete(body, 'الحذف', async () => {
      closeSheet(); applyStock(old.stk || {}, +1);
      const p = kfcWrite(date, id, null); render();
      if (await p) toast('تم حذف الدفعة' + (Object.keys(old.stk || {}).length ? ' وأُعيدت موادها للمخزون' : ''));
    });
  });
}
function kfcWrite(date, bid, data){
  const cur = S.kfc[date], path = 'kfc/' + date;
  let body, p;
  if (cur && cur.batches){
    body = Object.assign({}, cur, {batches:Object.assign({}, cur.batches, {[bid]:data})});
    p = upd(path, {batches:{[bid]:data}}, body);
  } else {
    if (!data) return Promise.resolve(true);
    body = {date, month:date.slice(0, 7), batches:{[bid]:data}};
    p = put(path, body);
  }
  S.kfc = Object.assign({}, S.kfc, {[date]:body});
  return p;
}

/* ---------- drinks ----------
   drinks/{id} {name, per (cans per carton), cartonCost, price (per can), qty (cans), min}
   drinklog/YYYY-MM-DD {date, month, rows:{drinkId:{start, sold, cartons, bought, count|null, end, missing, price, unit}}}
   A day row moves stock from start to end; editing a day shifts the drink's stock by the change in end. */
const drinkList = () => sortByName(S.drinks);
const unitCost = d => (+d.per || 0) ? (+d.cartonCost || 0) / (+d.per) : 0;
const cansW = n => { n = Math.round(+n || 0); const a = Math.abs(n); return a === 1 ? 'قوطية' : a === 2 ? 'قوطيتين' : NUM(fmt(n)) + (a >= 3 && a <= 10 ? ' قوطيات' : ' قوطية'); };
const cartonsLabel = (q, per) => { q = Math.round(+q || 0); per = +per || 0; if (!per || q < per || q < 0) return cansW(q); const c = Math.floor(q / per), r = q % per; return NUM(fmt(c)) + ' كارتون' + (r ? ' + ' + cansW(r) : ''); };
const logRows = d => Object.entries((d && d.rows) || {}).filter(([, r]) => r);
const drinkRev = r => (+r.sold || 0) * (+r.price || 0);
const drinkProfit = r => (+r.sold || 0) * ((+r.price || 0) - (+r.unit || 0));
const DRINK_SUGG = ['ببسي','سفن أب','ميرندا','ماونتن ديو','كولا','ماء','عصير','لبن','مشروب طاقة'];

function drinksView(){
  const list = drinkList(), today = dayKey();
  const top = head('المشروبات', 'بالكارتون والقوطية: البيع والمخزون والنقص', `<div class="chips">${list.length ? `<button class="btn" data-act="add-drink">${ic('plus')} مشروب</button><button class="btn btn-primary" data-act="drink-day" data-date="${today}">${ic('check')} تسجيل اليوم</button>` : ''}</div>`);
  if (!list.length) return top + `<div class="panel empty"><span class="av av8" style="width:56px;height:56px;border-radius:16px">${ic('drinks')}</span><strong>أضف مشروباتك أولاً</strong>
    <span>لكل مشروب: كم قوطية بالكارتون، سعر الكارتون، وسعر بيع القوطية. وبعدها كل يوم تكتب كم بعت وكم موجود، فيطلع لك النقص والربح.</span>
    <div class="chips" style="justify-content:center">${DRINK_SUGG.map(n => `<button class="chip-s" data-act="add-drink" data-name="${esc(n)}">${ic('plus')} ${esc(n)}</button>`).join('')}</div></div>`;
  const days = Object.values(S.drinklog).filter(d => d && d.month === S.month && d.date).sort((a, b) => b.date.localeCompare(a.date));
  const tRows = logRows(S.drinklog[today]).map(([, r]) => r);
  const mRows = days.flatMap(d => logRows(d).map(([, r]) => r));
  const T = (rows, f) => sum(rows, f);
  const stockValue = sum(list, ([, d]) => Math.max(0, +d.qty || 0) * unitCost(d));
  const missM = T(mRows, r => Math.max(0, +r.missing || 0));
  return top + `
  <section class="hero" aria-label="ملخص المشروبات">
    <div><div class="lbl">ربح المشروبات اليوم</div><div class="big">${IQD(T(tRows, drinkProfit))}</div>
      <div class="hero-stats" style="margin-top:14px"><div><span class="lbl">المبيع</span><b>${IQD(T(tRows, drinkRev))}</b></div><div><span class="lbl">القوطيات</span><b>${NUM(fmt(T(tRows, r => r.sold)))}</b></div><div><span class="lbl">النقص</span><b>${NUM(fmt(T(tRows, r => Math.max(0, +r.missing || 0))))}</b></div></div></div>
    <div class="hero-stats"><div><span class="lbl">ربح ${MONTHS[+S.month.slice(5) - 1]}</span><b>${IQD(T(mRows, drinkProfit))}</b></div><div><span class="lbl">مبيع الشهر</span><b>${IQD(T(mRows, drinkRev))}</b></div><div><span class="lbl">قيمة المخزون</span><b>${IQD(stockValue)}</b></div>
      <div><span class="lbl">قوطيات الشهر</span><b>${NUM(fmt(T(mRows, r => r.sold)))}</b></div><div><span class="lbl">نقص الشهر</span><b>${cansW(missM)}</b></div><div><span class="lbl">قيمة النقص</span><b>${IQD(T(mRows, r => Math.max(0, +r.missing || 0) * (+r.price || 0)))}</b></div></div>
  </section>
  <section><div class="sec-head"><h2>${ic('inv')} المخزون الآن</h2><span class="muted">اضغط على المشروب لتعديله</span></div>
    <div class="dk-grid">${list.map(([id, d]) => {
      const q = +d.qty || 0, st = q <= 0 ? 'out' : q <= (+d.min || 0) ? 'low' : 'ok', per = +d.per || 0, pr = (+d.price || 0) - unitCost(d);
      const tr = S.drinklog[today] && S.drinklog[today].rows && S.drinklog[today].rows[id];
      return `<button class="dk" data-act="edit-drink" data-id="${id}"><span class="dk-top"><span class="${avc(d.name)}">${ini(d.name)}</span><span class="li-main"><b>${esc(d.name)}</b><small>${per ? 'كارتون ' + NUM(per) + ' · ' : ''}${IQD(d.price)} للقوطية</small></span><span class="pill ${st}">${STATUS[st]}</span></span>
        <span class="dk-qty">${cartonsLabel(q, per)}</span><span class="dk-sub">${q !== Math.round(q) || per && q >= per ? cansW(q) + ' · ' : ''}ربح القوطية ${IQD(pr)}</span>
        <span class="meter ${st}"><i style="width:${Math.max(0, Math.min(100, (+d.min ? q / (d.min * 3) : q > 0 ? 1 : 0) * 100))}%"></i></span>
        ${tr ? `<span class="dk-sub">اليوم: بيع ${cansW(tr.sold)}${+tr.missing > 0 ? ` · <b style="color:var(--bad)">ناقص ${cansW(tr.missing)}</b>` : ''}</span>` : ''}</button>`;
    }).join('')}</div></section>
  <section><div class="sec-head"><h2>${ic('notes')} السجل اليومي</h2>${monthNav()}</div>
    ${days.length ? `<div class="list">${days.map(d => { const rs = logRows(d).map(([, r]) => r), miss = sum(rs, r => Math.max(0, +r.missing || 0));
      return `<button class="day-row" data-act="drink-day" data-date="${d.date}"><span class="day-date"><b>${+d.date.slice(8)}</b><span>${DAYNAME[JSDAY[dateOf(d.date).getDay()]]}</span></span>
        <span class="day-people">${logRows(d).map(([id, r]) => `<span class="mini" style="background:var(--sunken)">${esc(r.name || (S.drinks[id] && S.drinks[id].name) || '')} ${NUM(fmt(r.sold))}${+r.cartons ? ' · +' + r.cartons + ' كارتون' : ''}</span>`).join('')}</span>
        <span class="li-end" style="flex-direction:column;align-items:flex-end;gap:2px"><b>${IQD(sum(rs, drinkRev))}</b>${miss ? `<span class="small" style="color:var(--bad)">ناقص ${cansW(miss)}</span>` : '<span class="small" style="color:var(--good)">مضبوط ✓</span>'}</span></button>`; }).join('')}</div>`
      : `<div class="panel empty"><span>لا يوجد تسجيل في ${monthLabel(S.month)}. اضغط «تسجيل اليوم».</span></div>`}
  </section>`;
}

function openDrink(id, name){
  const d = id ? S.drinks[id] : {name:name || '', per:24, cartonCost:'', price:'', qty:0, min:''};
  if (id && !d) return;
  const per = +d.per || 0, q = +d.qty || 0;
  openSheet(id ? 'تعديل ' + d.name : 'مشروب جديد', `<form class="form" novalidate>
    <label>اسم المشروب<input id="f-name" maxlength="40" value="${esc(d.name)}" placeholder="مثال: ببسي 400 مل"></label>
    <div class="row3"><label>قوطية بالكارتون<input id="f-per" inputmode="numeric" value="${per || ''}" placeholder="24"></label>
      <label>سعر الكارتون (د.ع)<input id="f-cc" inputmode="numeric" value="${+d.cartonCost || ''}" placeholder="شراء"></label>
      <label>سعر بيع القوطية<input id="f-price" inputmode="numeric" value="${+d.price || ''}" placeholder="د.ع"></label></div>
    <div class="fsec"><b>${ic('inv')} الموجود الآن</b>
      <div class="row2"><label>كراتين كاملة<input id="f-qc" inputmode="numeric" value="${per && q >= per ? Math.floor(q / per) : ''}" placeholder="0"></label>
        <label>قوطيات مفردة<input id="f-qs" inputmode="numeric" value="${per ? (q >= per ? q % per : q) || '' : q || ''}" placeholder="0"></label></div>
      <label>نبّهني إذا نزل عن (قوطية)<input id="f-min" inputmode="numeric" value="${+d.min || ''}" placeholder="مثال: 24"></label></div>
    <div class="calc" id="calc"></div>
    ${formActions(id ? 'حذف المشروب' : '')}</form>`, body => {
    const $f = s => body.querySelector(s);
    const read = () => { const pr = Math.round(num($f('#f-per').value)); return {name:$f('#f-name').value.trim(), per:pr, cartonCost:Math.round(num($f('#f-cc').value)), price:Math.round(num($f('#f-price').value)),
      qty:Math.round(num($f('#f-qc').value)) * pr + Math.round(num($f('#f-qs').value)), min:Math.round(num($f('#f-min').value))}; };
    const calc = () => { const y = read(), u = unitCost(y), pr = y.price - u;
      $f('#calc').innerHTML = `<div><span>كلفة القوطية</span><b>${IQD(u)}</b></div><div><span>ربح القوطية</span><b class="${pr < 0 ? 'neg-v' : 'pos-v'}">${IQD(pr)}</b></div><div><span>ربح الكارتون</span><b class="${pr < 0 ? 'neg-v' : 'pos-v'}">${IQD(pr * y.per)}</b></div>
        <div><span>المجموع</span><b>${cansW(y.qty)}</b></div><div><span>قيمته</span><b>${IQD(y.qty * u)}</b></div><div><span>نسبة الربح</span><b>${NUM((y.price ? Math.round(pr / y.price * 100) : 0) + '%')}</b></div>`; };
    body.addEventListener('input', calc); calc();
    bindForm(body, async f => {
      const y = read();
      if (!y.name) return setErr(f, 'اكتب اسم المشروب.');
      if (y.per <= 0) return setErr(f, 'اكتب كم قوطية بالكارتون.');
      if (y.price <= 0) return setErr(f, 'اكتب سعر بيع القوطية.');
      const data = Object.assign({}, d, y), key = id || uid();
      closeSheet(); S.drinks = Object.assign({}, S.drinks, {[key]:data}); render();
      if (await put('drinks/' + key, data)) toast('تم حفظ ' + y.name);
    });
    sheetDelete(body, 'الحذف', async () => { closeSheet(); const c = Object.assign({}, S.drinks); delete c[id]; S.drinks = c; render(); if (await del('drinks/' + id)) toast('تم حذف المشروب'); });
  });
}

function openDrinkDay(date){
  const list = drinkList(); if (!list.length) return openDrink();
  date = date || dayKey();
  if (!covered('drinklog', date)) return toast('انتظر لحظة حتى يُحمَّل السجل', true);
  const log = S.drinklog[date], rows = (log && log.rows) || {};
  const minM = [S.month, shiftMonth(S.cur, -1)].sort()[0];
  const expId = 'drink-' + date, hadExp = !!S.expenses[expId];
  openSheet('مشروبات ' + dayLabel(date), `<form class="form" novalidate>
    <div class="row2"><label>اليوم<input id="f-date" type="date" value="${date}" min="${minM}-01" max="${dayKey()}"></label><p class="hint" style="align-self:end;margin:0 0 8px">اكتب البيع والشراء، واكتب العدد الموجود إذا عددته حتى يطلع النقص.</p></div>
    ${list.map(([id, d]) => { const r = rows[id], per = +d.per || 0;
      return `<div class="fsec dd" data-id="${id}"><b><span class="${avc(d.name)}" style="width:28px;height:28px;border-radius:9px">${ini(d.name)}</span> ${esc(d.name)} <span class="muted small" style="margin-inline-start:auto;font-weight:500">البداية ${cartonsLabel(r ? r.start : d.qty, per)}</span></b>
        <div class="row3"><label>بعت (قوطية)<input class="d-sold" inputmode="numeric" value="${r && +r.sold ? r.sold : ''}" placeholder="0"></label>
          <label>اشتريت (كارتون)<input class="d-buy" inputmode="decimal" value="${r && +r.cartons ? r.cartons : ''}" placeholder="0"></label>
          <label>العدد الموجود<input class="d-count" inputmode="numeric" value="${r && r.count != null ? r.count : ''}" placeholder="اختياري"></label></div>
        <p class="hint d-res"></p></div>`; }).join('')}
    <label class="check"><input type="checkbox" id="f-exp" ${hadExp || !log ? 'checked' : ''}> سجّل مبلغ الكراتين المشتراة في المصاريف</label>
    <div class="calc" id="calc"></div>
    ${formActions()}</form>`, body => {
    const $f = s => body.querySelector(s);
    $f('#f-date').addEventListener('change', () => { const nd = $f('#f-date').value; if (nd && nd !== date){ closeSheet(); openDrinkDay(nd); } });
    const read = () => [...body.querySelectorAll('.dd')].map(el => {
      const id = el.dataset.id, d = S.drinks[id], old = rows[id], per = +d.per || 0;
      const start = old ? +old.start : (+d.qty || 0);
      const sold = Math.round(num(el.querySelector('.d-sold').value)), cartons = round(num(el.querySelector('.d-buy').value), 2), bought = Math.round(cartons * per);
      const cRaw = el.querySelector('.d-count').value.trim(), count = cRaw === '' ? null : Math.round(num(cRaw));
      const expected = start + bought - sold, end = count == null ? expected : count;
      return {id, d, el, old, row:{name:d.name, per, start, sold, cartons, bought, count, expected, end, missing: count == null ? 0 : expected - count, price:+d.price || 0, unit:Math.round(unitCost(d))},
        used: sold > 0 || cartons > 0 || count != null};
    });
    const calc = () => {
      const xs = read();
      xs.forEach(x => { const r = x.row; x.el.querySelector('.d-res').innerHTML = !x.used ? '' :
        `المفروض يكون ${cartonsLabel(r.expected, r.per)}` + (r.count == null ? '' : r.missing > 0 ? ` · العد ${cansW(r.count)} · <b style="color:var(--bad)">ناقص ${cansW(r.missing)} ≈ ${IQD(r.missing * r.price)}</b>` : r.missing < 0 ? ` · العد ${cansW(r.count)} · <b style="color:var(--warn)">زايد ${cansW(-r.missing)}</b>` : ' · <b style="color:var(--good)">مضبوط ✓</b>'); });
      const u = xs.filter(x => x.used).map(x => x.row);
      $f('#calc').innerHTML = `<div><span>المبيع</span><b>${IQD(sum(u, drinkRev))}</b></div><div><span>الربح</span><b class="pos-v">${IQD(sum(u, drinkProfit))}</b></div><div><span>النقص</span><b class="${sum(u, r => Math.max(0, r.missing)) ? 'neg-v' : ''}">${IQD(sum(u, r => Math.max(0, r.missing) * r.price))}</b></div>
        <div><span>القوطيات</span><b>${NUM(fmt(sum(u, r => r.sold)))}</b></div><div><span>المشتريات</span><b>${IQD(sum(xs.filter(x => x.used), x => x.row.cartons * (+x.d.cartonCost || 0)))}</b></div><div><span>الكراتين</span><b>${NUM(fmtQ(sum(u, r => r.cartons)))}</b></div>`;
    };
    body.addEventListener('input', calc); calc();
    bindForm(body, async f => {
      const xs = read(), patch = {}, full = {}, wantExp = $f('#f-exp').checked;
      let any = false;
      for (const x of xs){
        if (x.row.sold < 0 || x.row.cartons < 0) return setErr(f, 'الأرقام لا تكون بالسالب.');
        const prevEnd = x.old ? +x.old.end : (+x.d.qty || 0);
        if (x.used){ const r = Object.assign({}, x.row); delete r.expected; patch[x.id] = r; full[x.id] = r; any = true; }
        else if (x.old) patch[x.id] = null;
        const newEnd = x.used ? x.row.end : (x.old ? +x.old.start : prevEnd);
        const dq = newEnd - prevEnd;
        if (dq){ const nd = Object.assign({}, x.d, {qty:(+x.d.qty || 0) + dq}); S.drinks = Object.assign({}, S.drinks, {[x.id]:nd}); upd('drinks/' + x.id, {qty:nd.qty}, nd); }
      }
      closeSheet();
      const path = 'drinklog/' + date, keep = Object.assign({}, Object.fromEntries(logRows(log)), full);
      Object.keys(patch).forEach(k => { if (patch[k] === null) delete keep[k]; });
      let p;
      if (log){ const body2 = Object.assign({}, log, {rows:Object.assign({}, log.rows, patch)}); S.drinklog = Object.assign({}, S.drinklog, {[date]:body2}); p = upd(path, {rows:patch}, body2); }
      else if (any){ const body2 = {date, month:date.slice(0, 7), rows:full}; S.drinklog = Object.assign({}, S.drinklog, {[date]:body2}); p = put(path, body2); }
      else p = Promise.resolve(true);
      const buy = Math.round(sum(xs.filter(x => x.used), x => x.row.cartons * (+x.d.cartonCost || 0)));
      if (wantExp && buy > 0){
        const ex = {date, month:date.slice(0, 7), cat:'مشروبات', amount:buy, note:xs.filter(x => x.used && x.row.cartons).map(x => x.d.name + ' ' + fmtQ(x.row.cartons) + ' كارتون').join('، '), t:(S.expenses[expId] && S.expenses[expId].t) || Date.now(), drinks:true};
        S.expenses = Object.assign({}, S.expenses, {[expId]:ex}); put('expenses/' + expId, ex);
      } else if (hadExp){ const c = Object.assign({}, S.expenses); delete c[expId]; S.expenses = c; del('expenses/' + expId); }
      render();
      if (await p){ const u = Object.values(keep); const miss = sum(u, r => Math.max(0, +r.missing || 0)); toast(miss ? 'تم الحفظ · ناقص ' + miss + (miss >= 3 && miss <= 10 ? ' قوطيات' : ' قوطية') : 'تم الحفظ · ربح ' + fmt(sum(u, drinkProfit)) + ' د.ع'); }
    });
  });
}

const VIEWS = {home:homeView, pos:posView, shawarma:shawarmaView, kfc:kfcView, drinks:drinksView, dishes:dishesView, inv:invView, staff:staffView, exp:expView, notes:notesView};

/* ================= sheet & toast ================= */
let lastFocus = null;
function openSheet(title, html, mount){
  lastFocus = document.activeElement;
  const el = $('#sheet');
  $('#sheet-title').textContent = title;
  const old = el.querySelector('.sheet-body'), body = old.cloneNode(false);
  old.replaceWith(body);
  body.innerHTML = html;
  el.hidden = false;
  mount && mount(body);
  const first = body.querySelector('input:not([type=checkbox]):not([type=radio]),textarea,select');
  if (first && window.matchMedia('(min-width:700px)').matches) first.focus();
}
function closeSheet(){ $('#sheet').hidden = true; $('#sheet .sheet-body').innerHTML = ''; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch(e){} }
let toastT = null;
function toast(msg, bad){
  const t = $('#toast'); t.innerHTML = (bad ? '' : ic('check')) + '<span>' + esc(msg) + '</span>'; t.className = bad ? 'bad' : ''; t.hidden = true; void t.offsetWidth; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, bad ? 4200 : 2400);
}
function bindForm(body, onSubmit){
  const f = body.querySelector('form');
  f.addEventListener('submit', e => { e.preventDefault(); onSubmit(f); });
  return f;
}
function sheetDelete(body, label, fn){
  const b = body.querySelector('[data-sdel]'); if (!b) return;
  let armed = false;
  b.addEventListener('click', () => { if (!armed){ armed = true; b.textContent = 'اضغط مرة ثانية للتأكيد'; return; } fn(); });
}
const val = (f, id) => f.querySelector('#' + id).value;
const setErr = (f, msg) => { const e = f.querySelector('.err'); if (e) e.textContent = msg || ''; };
const formActions = (delLabel) => `<p class="err" role="alert"></p><div class="form-actions"><div class="main-acts"><button class="btn btn-primary" type="submit">حفظ</button><button type="button" class="btn btn-ghost" data-close>إلغاء</button></div>${delLabel ? `<button type="button" class="btn btn-sm btn-danger" data-sdel>${delLabel}</button>` : ''}</div>`;

      <div class="radio-chips">${[['auto','تلقائي'],['light','فاتح'],['dark','داكن']].map(([k, l]) => `<label><input type="radio" name="theme" value="${k}" ${themeGet() === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></fieldset>

function openItem(id){
