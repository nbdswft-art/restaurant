function savePay(sid, entry, wasPaid){
  const pk = payKey();
  if (S.payrollFor !== pk){ toast('انتظر لحظة حتى تُحمَّل الرواتب', true); return; }
  const cur = S.payroll;
  const doc = {period:pk, kind:S.payMode, month:S.payMode === 'week' ? S.week.slice(0, 7) : S.month, staff:Object.assign({}, (cur && cur.staff) || {}, {[sid]:entry})};
  S.payroll = doc; queueRender();
  if (cur) upd('payroll/' + pk, {staff:{[sid]:entry}}, doc); else ups('payroll/' + pk, {period:doc.period, kind:doc.kind, month:doc.month, staff:{[sid]:entry}}, doc);
  const eid = 'pay-' + pk + '-' + sid, st = S.staff[sid];
  if (entry.paid){
    const [a, b] = periodRange(), t = dayKey();
    const date = (S.expenses[eid] && S.expenses[eid].date) || (t >= a && t <= b ? t : b);
    const ex = {date, month:date.slice(0, 7), cat:'رواتب', amount:netOf(sid, entry), note:(S.payMode === 'week' ? 'أجر أسبوع ' + dayLabel(a, false) + ' · ' : 'راتب ' + monthLabel(S.month) + ' · ') + (st ? st.name : ''), payroll:true, t:Date.now()};
    S.expenses = Object.assign({}, S.expenses, {[eid]:ex});
    put('expenses/' + eid, ex);
  } else if (wasPaid){
    const c = Object.assign({}, S.expenses); delete c[eid]; S.expenses = c;
    del('expenses/' + eid);
  }
}

function saveAtt(date, patch){
  const m = date.slice(0, 7);
  if (!covered('att', date)){ toast('انتظر لحظة حتى يُحمَّل الحضور', true); return; }
  const cur = S.att[m], meta = {[date]:{by:myRole() || '', at:Date.now()}};
  const days = Object.assign({}, (cur && cur.days) || {});
  days[date] = Object.assign({}, days[date] || {}, patch);
  const full = {month:m, days, meta:Object.assign({}, (cur && cur.meta) || {}, meta)};
  S.att = Object.assign({}, S.att, {[m]:full}); render();
  return cur ? upd('att/' + m, {days:{[date]:patch}, meta}, full) : ups('att/' + m, {month:m, days:{[date]:patch}, meta}, full);
}

async function applyStock(map, sign){
  for (const [id, q] of Object.entries(map)){
    const it = S.items[id]; if (!it) continue;
    const qty = round((+it.qty || 0) + sign * q), full = Object.assign({}, it, {qty});
    S.items = Object.assign({}, S.items, {[id]:full});
    upd('items/' + id, {qty}, full);
  }
}

async function sell(){
  const lines = Object.entries(S.cart).filter(([d, q]) => q > 0 && S.dishes[d]).map(([d, q]) => ({d, q, n:S.dishes[d].name, p:+S.dishes[d].price || 0}));
  if (!lines.length) return;
  const total = sum(lines, l => l.q * l.p);
  const order = {id:uid(), t:Date.now(), lines, total};
  const day = dayKey(), cur = S.sales[day];
  let body, saved;
  if (cur && cur.orders && !Array.isArray(cur.orders)){
    body = Object.assign({}, cur, {orders:Object.assign({}, cur.orders, {[order.id]:order})});
    saved = upd('sales/' + day, {orders:{[order.id]:order}}, body);
  } else {
    const map = {}; toArr(cur && cur.orders).forEach(o => { map[o.id] = o; }); map[order.id] = order;
    body = {date:day, month:day.slice(0, 7), orders:map};
    saved = cur ? put('sales/' + day, body) : ups('sales/' + day, {date:day, month:day.slice(0, 7), orders:{[order.id]:order}}, body);
  }
  S.sales = Object.assign({}, S.sales, {[day]:body});
  S.cart = {};
  applyStock(consumption(lines), -1);
  render();
  if (await saved) toast('تم تسجيل البيع · ' + fmt(total) + ' د.ع');
}

async function delOrder(oid){
  const day = Object.keys(S.sales).find(k => ordersOfDay(k).some(o => o.id === oid)); if (!day) return;
  const doc = S.sales[day], order = ordersOfDay(day).find(o => o.id === oid);
  let body, saved;
  if (!Array.isArray(doc.orders)){
    body = Object.assign({}, doc, {orders:Object.assign({}, doc.orders, {[oid]:null})});
    saved = upd('sales/' + day, {orders:{[oid]:null}}, body);
  } else {
    const map = {}; doc.orders.forEach(o => { if (o.id !== oid) map[o.id] = o; });
    body = Object.assign({}, doc, {orders:map});
    saved = put('sales/' + day, body);
  }
  S.sales = Object.assign({}, S.sales, {[day]:body});
  applyStock(consumption(order.lines), +1);
  S.confirm = null; render();
  if (await saved) toast('حُذف الطلب وأُعيدت المكوّنات للمخزون');
}

async function clearSamples(){
  S.confirm = null;
  const jobs = [];
  ['items','dishes','staff','notes','expenses'].forEach(k => Object.entries(S[k]).forEach(([id, x]) => { if (x.sample) jobs.push(del(k + '/' + id)); }));
  Object.entries(S.sales).forEach(([day, d]) => {
    const all = toArr(d.orders), keep = all.filter(o => !o.sample);
    if (keep.length !== all.length){ const map = {}; keep.forEach(o => { map[o.id] = o; }); jobs.push(keep.length ? put('sales/' + day, Object.assign({}, d, {orders:map})) : del('sales/' + day)); }
  });
  if (S.payroll && S.payroll.sample) jobs.push(del('payroll/' + S.month));
  S.cart = {};
  toast('جارٍ حذف بيانات المثال…');
  const r = await Promise.all(jobs);
  if (r.every(Boolean)) toast('تم حذف بيانات المثال. الدفتر جاهز لبياناتك.');
}

  'feast-status': async d => { if (await setFeastStatus(d.id, d.s)) toast(d.s === 'done' ? 'تم التسليم ✓' + (S.feasts[d.id] && S.feasts[d.id].sale ? ' وأُضيفت للمبيعات' : '') : d.s === 'prep' ? 'بدأ التحضير' : 'رجعت الطلبية'); },
  'kfc-link': d => { const cur = S.settings.kfc, full = Object.assign({}, cur || {}, {item:d.id}); S.settings = Object.assign({}, S.settings, {kfc:full}); render(); (cur ? upd('settings/kfc', {item:d.id}, full) : ups('settings/kfc', full, full)); toast('رُبط الكنتاكي بـ ' + S.items[d.id].name); },
  'kfc-unlink': () => { const cur = S.settings.kfc; if (!cur) return; const full = Object.assign({}, cur, {item:''}); S.settings = Object.assign({}, S.settings, {kfc:full}); render(); upd('settings/kfc', {item:''}, full); },
  'kfc-newitem': () => openItem(null, {name:'دجاج كنتاكي', unit:'كغم'}, key => ACT['kfc-link']({id:key})),
  'add-drink': d => openDrink(null, d.name), 'edit-drink': d => openDrink(d.id), 'drink-day': d => openDrinkDay(d.date),
  'sh-recipe': () => openRecipe('sh'), 'kfc-recipe': () => openRecipe('kfc'),
  'add-kfc': () => openKfc(), 'edit-kfc': d => openKfc(d.id, d.date), 'kfc-meals': () => openKfcMeals()
};

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')){ closeSheet(); return; }
  const t = e.target.closest('[data-tab]');
  if (t && !t.closest('#sheet')){ S.tab = t.dataset.tab; S.confirm = null; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.closest('#sheet')) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset, b, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

const go = () => (window.__appReady || Promise.resolve()).then(init);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();
</script>

  </form>
</div>
<script>
/* ===== الربط مع Supabase: ضع هنا رابط المشروع والمفتاح العام (anon / publishable) ===== */
window.RESTAURANT_CONFIG = {
  supabaseUrl: 'https://vbhwbekoeqeqgmltmbym.supabase.co',
  supabaseKey: 'sb_publishable_GoBcFBbj2RI1vYnvRPlyrg_Cd71bwqx'
};
</script>
<script>
(function(){
'use strict';
/* يربط تطبيق المطعم بـ Supabase: تسجيل الدخول + قاعدة بيانات بنفس الواجهة التي يستخدمها التطبيق */
var CFG = window.RESTAURANT_CONFIG || {};
var appEl = document.getElementById('app');
var loginEl = document.getElementById('login');
var resolveReady;
window.__hosted = true;
window.__appReady = new Promise(function(r){ resolveReady = r; });
appEl.hidden = true;

function msg(text){
  loginEl.hidden = false;
  var e = document.getElementById('l-err');
  if (e) e.textContent = text || '';
}
var configured = CFG.supabaseUrl && CFG.supabaseUrl.indexOf('__') !== 0 && CFG.supabaseKey && CFG.supabaseKey.indexOf('__') !== 0;
if (!configured){
  msg('التطبيق لم يُربط بقاعدة البيانات بعد.');
  document.getElementById('l-btn').disabled = true;
  return;
}
/* تحميل مكتبة الاتصال: إذا فشل مصدر نجرب الذي بعده */
var LIBS = [
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js',
  'https://unpkg.com/@supabase/supabase-js@2.110.1/dist/umd/supabase.js',
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'
];
function loadLib(i){
  if (window.supabase && window.supabase.createClient) return boot();
  if (i >= LIBS.length){ msg('تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم حدّث الصفحة.'); document.getElementById('l-btn').disabled = true; return; }
  var sc = document.createElement('script');
  sc.src = LIBS[i]; sc.crossOrigin = 'anonymous'; sc.referrerPolicy = 'no-referrer';
  sc.onload = function(){ loadLib(window.supabase && window.supabase.createClient ? LIBS.length + 1 : i + 1); };
  sc.onerror = function(){ loadLib(i + 1); };
  document.head.appendChild(sc);
}
document.getElementById('l-btn').disabled = true;
loadLib(0);

function boot(){
document.getElementById('l-btn').disabled = false;
var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});

function toErr(e){
  var m = (e && (e.message || e.error_description)) || '';
  var code = /jwt|auth|permission|policy|row-level|401|403/i.test(m + ' ' + (e && e.code)) ? 'revoked' : 'unavailable';
  return { code: code, message: m };
}

/* ---------- قاعدة البيانات ---------- */
function makeDb(){
  var ls = new Set();
  function snapOf(map){
    var docs = Object.keys(map).sort().map(function(id){ var v = map[id]; return { id: id, exists: true, data: function(){ return v; }, metadata: {} }; });
    return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function(){ return []; }, metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function emit(l){
    if (l.dead) return;
    if (l.kind === 'doc'){ var v = l.val; l.next({ id: l.path.split('/').pop(), exists: v != null, data: function(){ return v == null ? undefined : v; }, metadata: {} }); }
    else l.next(snapOf(l.map));
  }
  function load(l){
    if (l.kind === 'doc'){
      return sb.from('docs').select('data').eq('path', l.path).maybeSingle().then(function(r){
        if (r.error) throw r.error;
        l.val = r.data ? r.data.data : null; emit(l);
      });
    }
    var q = sb.from('docs').select('path,data').eq('col', l.col);
    if (l.months) q = q.in('month', l.months);
    return q.limit(5000).then(function(r){
      if (r.error) throw r.error;
      var map = {};
      (r.data || []).forEach(function(row){ map[row.path.slice(l.col.length + 1)] = row.data; });
      l.map = map; emit(l);
    });
  }
  function loadAll(){ ls.forEach(function(l){ load(l).catch(function(){}); }); }
  function inCol(l, path){ return path.indexOf(l.col + '/') === 0 && path.split('/').length === 2; }

  sb.channel('docs-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, function(p){
      if (p.eventType === 'DELETE'){
        var path = p.old && p.old.path;
        if (!path){ loadAll(); return; }
        ls.forEach(function(l){
          if (l.kind === 'doc'){ if (l.path === path){ l.val = null; emit(l); } return; }
          if (inCol(l, path)){ var id = path.slice(l.col.length + 1); if (id in l.map){ delete l.map[id]; emit(l); } }
        });
        return;
      }
      var row = p.new; if (!row || !row.path) return;
      ls.forEach(function(l){
        if (l.kind === 'doc'){ if (row.path === l.path){ l.val = row.data; emit(l); } return; }
        if (!inCol(l, row.path)) return;
        var id = row.path.slice(l.col.length + 1);
        if (!l.months || l.months.indexOf(row.month) !== -1){ l.map[id] = row.data; emit(l); }
        else if (id in l.map){ delete l.map[id]; emit(l); }
      });
    })
    .subscribe(function(status){ if (status === 'SUBSCRIBED') loadAll(); });

  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') loadAll(); });
  window.addEventListener('online', loadAll);
  setInterval(loadAll, 60000);

  function listen(l, next, onError){
    l.next = next; ls.add(l);
    load(l).catch(function(e){ var x = toErr(e); if (x.code === 'revoked' && onError) onError(x); });
    return function(){ l.dead = true; ls.delete(l); };
  }
  function query(col, months){
    return {
      where: function(field, op, v){ return query(col, Array.isArray(v) ? v.slice() : [v]); },
      onSnapshot: function(next, onError){ return listen({ kind: 'col', col: col, months: months, map: {} }, next, onError); }
    };
  }
  return {
    collection: function(c){ return query(c, null); },
    doc: function(path){
      return {
        onSnapshot: function(next, onError){ return listen({ kind: 'doc', path: path, val: null }, next, onError); },
        set: function(d){
          return sb.from('docs').upsert({ path: path, col: path.split('/')[0], month: (d && d.month) || null, data: d }).then(function(r){ if (r.error) throw toErr(r.error); });
        },
        update: function(patch){
          return sb.rpc('merge_doc', { p_path: path, p_patch: patch }).then(function(r){ if (r.error) throw toErr(r.error); });
        },
        delete: function(){
          return sb.from('docs').delete().eq('path', path).then(function(r){ if (r.error) throw toErr(r.error); });
        }
      };
    }
  };
}

/* ---------- الدخول ---------- */
var started = false;
function start(session){
  if (started) return;
  var email = (session.user && session.user.email || '').toLowerCase();
  sb.from('members').select('email,role,name').then(function(r){
    var list = (r.data || []);
    var me = list.find(function(m){ return String(m.email).toLowerCase() === email; });
    if (r.error || !me){
      sb.auth.signOut();
      msg('هذا الحساب غير مسموح له بدخول التطبيق.');
      return;
    }
    started = true;
    window.__members = list;
    window.__role = me.role;
    var db = makeDb();
    var user = { id: function(){ return Promise.resolve(email); }, can: function(){ return Promise.resolve(true); } };
    window.claude = { use: function(n){ return Promise.resolve(n === 'db' ? db : n === 'user' ? user : null); } };
    window.__logout = function(){ sb.auth.signOut().finally(function(){ location.reload(); }); };
    loginEl.hidden = true;
    appEl.hidden = false;
    resolveReady();
  });
}

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = document.getElementById('l-btn');
  var email = document.getElementById('l-email').value.trim();
  var pass = document.getElementById('l-pass').value;
  if (!email || !pass){ msg('اكتب الإيميل وكلمة المرور.'); return; }
  btn.disabled = true; btn.textContent = 'جارٍ الدخول…'; msg('');
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(r){
    btn.disabled = false; btn.textContent = 'دخول';
    if (r.error){
      msg(/invalid/i.test(r.error.message) ? 'الإيميل أو كلمة المرور غير صحيحة.' : /rate|many/i.test(r.error.message) ? 'محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.' : 'تعذّر الدخول. تحقق من الإنترنت.');
      return;
    }
    document.getElementById('l-pass').value = '';
    start(r.data.session);
  });
});

sb.auth.onAuthStateChange(function(event){ if (event === 'SIGNED_OUT' && started) location.reload(); });
sb.auth.getSession().then(function(r){
  if (r.data && r.data.session) start(r.data.session);
  else msg('');
});
}
})();

</script>
