<style>
/* Layout: phone-first ledger. One content column with a fixed bottom tab bar; from 900px the bar becomes a rail on the right (RTL start). */
:root{
  /* modern light: white surfaces, each section has its own colour (--c), and the accent follows the open section */
  --bg:#F4F5FA; --surface:#FFFFFF; --sunken:#EEF0F6; --line:#E2E5EF;
  --ink:#151A2D; --muted:#5B6279; --faint:#8E94AA;
  --good:#0E9F6E; --good-soft:#DDF7EC; --warn:#B45309; --warn-soft:#FEF0D7; --bad:#DC2626; --bad-soft:#FDE4E4;
  --sh-m:#D9F5EF; --sh-m-ink:#0F766E; --sh-e:#ECE7FE; --sh-e-ink:#5B3FD0;
  --sh-f:#FEF0D7; --sh-f-ink:#9A4A07; --sh-off:#EEF0F6; --sh-off-ink:#8E94AA;
  --c-home:#5B4CF0; --c-pos:#059669; --c-shawarma:#EA580C; --c-kfc:#DC2626; --c-staff:#2563EB; --c-inv:#0D9488; --c-dishes:#DB2777; --c-exp:#D97706; --c-notes:#7C3AED; --c-drinks:#0891B2; --c-feasts:#B7791F; --c-social:#DB2777; --hero-mix:#8B5CF6;
  --on-accent:#FFFFFF; --mix:#FFFFFF;
  --c:var(--c-home);
  --accent:var(--c); --accent-hover:color-mix(in srgb,var(--c) 85%,#000);
  --accent-soft:color-mix(in srgb,var(--c) 13%,var(--mix));
  --gold:var(--c-shawarma); --gold-soft:color-mix(in srgb,var(--c-shawarma) 14%,var(--mix));
  --plum:var(--c-notes); --plum-soft:color-mix(in srgb,var(--c-notes) 14%,var(--mix));
  --shadow:0 1px 2px rgba(21,26,45,.05),0 12px 30px rgba(21,26,45,.08);
  --shadow-sm:0 1px 2px rgba(21,26,45,.04),0 3px 10px rgba(21,26,45,.05);
  --backdrop:rgba(15,18,35,.45); --hero-ink:#FFFFFF; --hero-k:100%;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:18px; --nav-h:68px;
}
/* skins: «زعفران» (warm, default), «ملوّن» (the plain :root above), «ليل ذهبي» (dark luxe, ignores the light/dark switch) */
:root[data-skin="saffron"]{
  --bg:#FAF4EA; --surface:#FFFDF8; --sunken:#F2E9DA; --line:#E7DAC4;
  --ink:#2A1C10; --muted:#75604B; --faint:#A8937B;
  --good:#2F7D4F; --good-soft:#E2F1E2; --warn:#A35A0C; --warn-soft:#FBEBD2; --bad:#B83227; --bad-soft:#F9E0DA;
  --c-home:#B4532A; --c-pos:#2F7D5B; --c-shawarma:#D2691E; --c-kfc:#B8322A; --c-drinks:#1F7A8C; --c-staff:#3B5BA5; --c-inv:#5B7B36;
  --c-dishes:#A23B6B; --c-exp:#A8740F; --c-notes:#7A4FA0; --c-feasts:#B8860B; --c-social:#C2185B;
  --mix:#FFFDF8; --hero-mix:#6B2410;
  --shadow:0 1px 2px rgba(60,35,10,.06),0 12px 30px rgba(60,35,10,.09); --shadow-sm:0 1px 2px rgba(60,35,10,.05),0 3px 10px rgba(60,35,10,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --sh-m:#163A33; --sh-m-ink:#5EEAD4; --sh-e:#2A2550; --sh-e-ink:#C4B5FD;
  --sh-f:#3A2D10; --sh-f-ink:#FBBF24; --sh-off:#20243A; --sh-off-ink:#717794;
  --c-home:#818CF8; --c-pos:#34D399; --c-shawarma:#FB923C; --c-kfc:#F87171; --c-staff:#60A5FA; --c-inv:#2DD4BF; --c-dishes:#F472B6; --c-exp:#FBBF24; --c-notes:#A78BFA; --c-drinks:#22D3EE; --c-feasts:#F6C453; --c-social:#F472B6; --hero-mix:#6D28D9;

}}
:root[data-theme="dark"]{
  --bg:#0E1020; --surface:#171A2E; --sunken:#20243A; --line:#2C3150;
  --ink:#ECEEF8; --muted:#A6ABC4; --faint:#717794;
  --good:#4ADE80; --good-soft:#143323; --warn:#FBBF24; --warn-soft:#3A2D10; --bad:#F87171; --bad-soft:#3D1B1F;
  --sh-m:#163A33; --sh-m-ink:#5EEAD4; --sh-e:#2A2550; --sh-e-ink:#C4B5FD;
  --sh-f:#3A2D10; --sh-f-ink:#FBBF24; --sh-off:#20243A; --sh-off-ink:#717794;
  --c-home:#818CF8; --c-pos:#34D399; --c-shawarma:#FB923C; --c-kfc:#F87171; --c-staff:#60A5FA; --c-inv:#2DD4BF; --c-dishes:#F472B6; --c-exp:#FBBF24; --c-notes:#A78BFA; --c-drinks:#22D3EE; --c-feasts:#F6C453; --c-social:#F472B6; --hero-mix:#6D28D9;
  --on-accent:#0E1020; --mix:#0E1020;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3); --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --backdrop:rgba(0,0,0,.62); --hero-ink:#FFFFFF; --hero-k:58%; color-scheme:dark;
}
:root[data-skin="night"]{
  --bg:#0E0C09; --surface:#18150F; --sunken:#221D15; --line:#352B1E;
  --ink:#F4EADB; --muted:#BBA88E; --faint:#7F6F59;
  --good:#8BC78A; --good-soft:#1C2A17; --warn:#E8B04A; --warn-soft:#33260F; --bad:#E77B6A; --bad-soft:#371B16;
  --sh-m:#1F2A1A; --sh-m-ink:#A9D39A; --sh-e:#2A2236; --sh-e-ink:#CDB7F0; --sh-f:#33260F; --sh-f-ink:#E8B04A; --sh-off:#221D15; --sh-off-ink:#7F6F59;
  --c-home:#D9AE55; --c-pos:#93C58A; --c-shawarma:#E9A25A; --c-kfc:#E57B66; --c-drinks:#71C6D2; --c-staff:#93ABE3; --c-inv:#ACC283;
  --c-dishes:#E390B6; --c-exp:#E6B847; --c-notes:#C6A6EA; --c-feasts:#E8CB72; --c-social:#F07FA2;
  --on-accent:#0E0C09; --mix:#18150F; --hero-mix:#3A2A0E; --hero-k:62%; --hero-ink:#FFF8EC;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.4); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --backdrop:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{min-height:100%}
.n{unicode-bidi:isolate;direction:ltr;font-variant-numeric:tabular-nums;display:inline-block}
.cur{font-size:.78em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}

/* ---------- navigation ---------- */
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(18,40,30,.06);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs ul{display:flex;list-style:none;margin:0;padding:0;height:var(--nav-h)}
.tabs li{flex:1;min-width:0}
.tab{position:relative;width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:500;padding:0 2px;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--k,var(--accent));font-weight:700}
.tab[aria-current="page"] .tab-ic{background:color-mix(in srgb,var(--k,var(--accent)) 14%,var(--mix));transform:translateY(-1px)}
.tab-ic{display:grid;place-items:center;width:48px;height:30px;border-radius:999px;transition:background .2s,transform .2s}
.tab-badge{position:absolute;top:7px;inset-inline-end:calc(50% - 24px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.rail-brand,.rail-foot{display:none}
@media (max-width:899px){.rail-only{display:none}}
@media (min-width:900px){.mob-only{display:none}}
main{padding-block:20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  #app{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .tabs{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;border-top:0;border-left:1px solid var(--line);box-shadow:none;padding:20px 12px 14px;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .tabs ul{flex-direction:column;height:auto;gap:2px}
  .tabs li.grp{padding:14px 10px 4px;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:0}
  .tab{flex-direction:row;justify-content:flex-start;gap:10px;font-size:14.5px;padding:4px 8px;border-radius:11px;height:42px}
  .tab:hover{background:var(--sunken);color:var(--ink)}
  .tab[aria-current="page"]{background:color-mix(in srgb,var(--k,var(--accent)) 10%,var(--mix))}
  .tab .tab-ic{color:var(--k)}
  .tab-ic{width:36px;height:32px}
  .tab-badge{position:static;margin-inline-start:auto;border:0}
  .rail-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px;color:var(--ink);padding:4px 8px 14px;flex-shrink:0}
  .rail-brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--c-home),#8B5CF6);color:var(--hero-ink);display:grid;place-items:center;flex-shrink:0}
  .rail-brand .logo svg{width:22px;height:22px}
  .rail-foot{display:block;margin-top:auto;padding:14px 8px 0;color:var(--faint);font-size:12px;flex-shrink:0}
}
@media (min-width:900px) and (max-height:720px){
  .tab{height:36px;font-size:14px} .tab-ic{height:28px} .tabs li.grp{padding:10px 10px 2px} .rail-brand{padding-bottom:8px}
  main{padding-block:32px 48px}
}
@media (min-width:600px) and (max-width:899px){.tabs li.md-show{display:block}}
@media (max-width:899px){.tabs li.grp{display:none}}
@media (max-width:899px) and (max-height:520px){:root{--nav-h:54px}.tab-ic{height:24px;width:40px}.tab svg{width:20px;height:20px}.tab{gap:1px;font-size:10px}}
.more-h{margin:14px 2px 8px;font-size:12px;font-weight:700;color:var(--faint)}
.more-h:first-child{margin-top:4px}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:6px}
@media (min-width:560px){.more-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.more-grid button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:16px;text-align:right;font-weight:700;font-size:15px}
.more-grid button[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft)}
.more-grid .tab-ic{background:color-mix(in srgb,var(--k) 14%,var(--mix));width:44px;height:44px;border-radius:13px;color:var(--k)}
.more-grid small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.more-grid .tab-ic svg{width:23px;height:23px}
.more-grid .tab-badge{top:14px;left:14px;right:auto;inset-inline-end:auto;border-color:var(--bg)}

/* ---------- type & page head ---------- */
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:0}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:13px;font-weight:500}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-head h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-head h2 svg{width:19px;height:19px;color:var(--accent)}
.sec-head .muted{font-size:13px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pad{padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;min-width:0}
.li + .li{border-top:1px solid var(--line)}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;overflow-wrap:anywhere}
.li-meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.li-end{display:flex;align-items:center;gap:8px;flex-shrink:0}
.grid2{display:grid;gap:22px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty strong{color:var(--ink);font-size:16px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--sunken);color:var(--ink)}
.btn-danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn-sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.on{color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.plain::before{display:none}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--sunken);color:var(--muted);white-space:nowrap}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%),radial-gradient(80% 80% at 100% 100%,rgba(0,0,0,.14),transparent 60%),linear-gradient(140deg,color-mix(in srgb,var(--c) var(--hero-k),#000),color-mix(in srgb,color-mix(in srgb,var(--c) 55%,var(--hero-mix)) var(--hero-k),#000));color:var(--hero-ink);border-radius:24px;padding:20px;display:grid;gap:18px;box-shadow:0 14px 34px color-mix(in srgb,var(--c) 30%,transparent)}
.hero > *{position:relative}
.hero .lbl{opacity:.82;font-size:13px;font-weight:500}
.hero .big{font-family:var(--f-display);font-size:40px;line-height:1.15;font-weight:600}
.hero .big .cur{color:inherit;opacity:.75;font-family:var(--f-body)}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hero-stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;min-width:0}
.hero-stats b{display:block;font-size:17px;font-weight:700;white-space:nowrap}
.hero-stats .cur{color:inherit;opacity:.75}
.week{display:flex;align-items:flex-end;gap:8px;height:96px}
.week .bar{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:5px;height:100%;min-width:0}
.week .track{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.week .fill{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:rgba(255,255,255,.28);min-height:3px}
.week .bar.today .fill{background:var(--hero-ink)}
.week .d{font-size:11px;opacity:.8}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:end;padding:24px}}
.month-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.month-tiles div{padding:14px 16px;min-width:0}
.month-tiles div + div{border-right:1px solid var(--line)}
.month-tiles > div > span{display:block;color:var(--muted);font-size:13px}
.month-tiles b{font-size:18px;font-weight:700}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px}
.banner p{margin:0;flex:1;min-width:220px;font-size:14px}
.shift-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface);color:var(--ink)}

/* ---------- shifts ---------- */
.s-m{background:var(--sh-m);color:var(--sh-m-ink)}
.s-e{background:var(--sh-e);color:var(--sh-e-ink)}
.s-f{background:var(--sh-f);color:var(--sh-f-ink)}
.s-off{background:var(--sh-off);color:var(--sh-off-ink)}

/* ---------- POS ---------- */
.pos{display:grid;gap:18px}
@media (min-width:900px){.pos{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.cart{position:sticky;top:24px}}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.dish-btn{position:relative;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:96px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:border-color .15s,transform .08s}
.dish-btn:hover{border-color:var(--accent)}
.dish-btn:active{transform:scale(.98)}
.dish-btn .nm{font-weight:600;line-height:1.35;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.av{--k:var(--c-home);background:color-mix(in srgb,var(--k) 14%,var(--mix));color:var(--k)}
.av0{--k:var(--c-pos)} .av1{--k:var(--c-shawarma)} .av2{--k:var(--c-notes)} .av3{--k:var(--c-kfc)} .av4{--k:var(--c-staff)} .av5{--k:var(--c-dishes)} .av6{--k:var(--c-inv)} .av7{--k:var(--c-exp)} .av8{--k:var(--c-drinks)} .av-f{--k:var(--c-feasts)} .av-s{--k:var(--c-social)}
.dish-btn .pr{color:var(--muted);font-size:13px}
.dish-btn.in{border-color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column}
@media (max-width:899px){.cart.has{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));max-height:52vh}}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.cart-lines{overflow:auto;padding:4px 16px}
.cline{display:flex;align-items:center;gap:10px;padding:8px 0}
.cline + .cline{border-top:1px dashed var(--line)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.stepper button{width:32px;height:32px;border:0;background:var(--sunken);font-size:17px;font-weight:700;color:var(--ink);display:grid;place-items:center}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cart-foot{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.total-row{display:flex;justify-content:space-between;align-items:baseline}
.total-row b{font-size:22px;font-family:var(--f-display);font-weight:600}
.warn-note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}

/* ---------- summary strips ---------- */
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.stats > div{flex:1 1 104px;background:var(--surface);padding:12px 16px;min-width:0}
.stats > div > span{display:block;color:var(--muted);font-size:13px}
.stats b{font-size:18px;font-weight:700}
.stats .bad{color:var(--bad)} .stats .warn{color:var(--warn)} .stats .good{color:var(--good)}

/* ---------- inventory ---------- */
.qty{text-align:left;min-width:74px}
.qty b{font-size:18px;font-weight:700;display:block;line-height:1.2}
.qty small{color:var(--muted);font-size:12px}
.qty.out b{color:var(--bad)} .qty.low b{color:var(--warn)}
.meter{height:4px;border-radius:4px;background:var(--sunken);margin-top:6px;overflow:hidden;max-width:220px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--good)}
.meter.low i{background:var(--warn)} .meter.out i{background:var(--bad)}
@media (max-width:520px){.li.wrapm{flex-wrap:wrap}.li.wrapm .li-end{width:100%;justify-content:flex-end}}

/* ---------- schedule ---------- */
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sched{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
.sched th,.sched td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:13px}
.sched thead th{font-weight:600;color:var(--muted);background:var(--surface)}
.sched thead th.today{color:var(--accent)}
.sched thead th.today span{border-bottom:2px solid var(--accent)}
.sched th.who{text-align:right;position:sticky;right:0;background:var(--surface);z-index:1;min-width:140px;padding-right:16px}
.sched td.today{background:var(--accent-soft)}
.sched tbody tr:last-child td,.sched tbody tr:last-child th{border-bottom:0}
.who-btn{border:0;background:none;text-align:right;padding:0;display:flex;flex-direction:column}
.who-btn b{font-weight:600;font-size:14px;color:var(--ink)}
.who-btn span{font-size:12px;color:var(--muted)}
.shift-btn{width:100%;min-width:64px;border:0;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px}
.sched tfoot td,.sched tfoot th{border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:12px;background:var(--surface)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.legend span{border-radius:999px;padding:3px 10px;font-weight:600}

/* ---------- payroll ---------- */
.pay{display:grid;gap:12px}
.pay-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.pay-card.paid{border-color:var(--good)}
.pay-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pay-net{text-align:left}
.pay-net > span{display:block;color:var(--muted);font-size:12px}
.pay-net b{font-size:20px;font-weight:700}
.pay-mid{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.txs{display:flex;gap:6px;flex-wrap:wrap}
.tx{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--sunken);padding:3px 4px 3px 10px;font-size:12px;font-weight:600}
.tx.bonus{background:var(--good-soft);color:var(--good)}
.tx.deduct,.tx.advance{background:var(--warn-soft);color:var(--warn)}
.tx button{border:0;background:none;color:inherit;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;opacity:.7}
.tx button:hover{opacity:1;background:rgba(0,0,0,.08)}
.tx button svg{width:13px;height:13px}
.pay-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.paid-btn.on{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}

/* ---------- month nav ---------- */
.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.monthnav strong{min-width:132px;text-align:center;font-size:14px}

/* ---------- expenses ---------- */
.cats{display:grid;gap:10px}
.cat-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.cat-track{height:10px;background:var(--sunken);border-radius:6px;overflow:hidden}
.cat-track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.day-head{padding:8px 16px;background:var(--sunken);font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}

/* ---------- notes ---------- */
.notes{display:grid;gap:22px 18px;padding:8px 2px 4px}
@media (min-width:700px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.notes{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* sticky paper: stays paper-coloured in dark mode too, like a real note on the fridge */
.note{--paper:#FFF1A8;--pink:#E8D27A;position:relative;background:linear-gradient(135deg,transparent 0 0),var(--paper);color:#2B2416;border-radius:3px 3px 3px 18px;padding:26px 18px 12px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 20px -8px rgba(60,40,0,.35);transform:rotate(var(--tilt,-1deg));transition:transform .2s ease,box-shadow .2s ease;min-height:150px}
.note:nth-child(3n+2){--tilt:1.2deg} .note:nth-child(3n){--tilt:-.4deg}
.note:hover{transform:rotate(0) translateY(-3px);box-shadow:0 1px 1px rgba(0,0,0,.08),0 16px 28px -10px rgba(60,40,0,.4)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.12);backdrop-filter:blur(1px)}
.note::after{content:"";position:absolute;left:0;bottom:0;width:22px;height:22px;background:linear-gradient(45deg,rgba(0,0,0,.12) 0 50%,transparent 50%);border-radius:0 0 0 18px}
.note.pinned::before{width:20px;height:20px;top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8A80,#C62828 60%,#7F1010);box-shadow:0 3px 4px rgba(0,0,0,.35);transform:translateX(-50%)}
.note.c-y{--paper:#FFF1A8} .note.c-p{--paper:#FFD9E2} .note.c-b{--paper:#D3E9FF} .note.c-g{--paper:#D8F3D2} .note.c-v{--paper:#E7DCFF} .note.c-o{--paper:#FFE0BF}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:"Aref Ruqaa",var(--f-body);font-size:21px;line-height:1.55}
.note .author{background:rgba(0,0,0,.08)!important;color:#2B2416!important}
.note-foot{display:flex;justify-content:space-between;align-items:center;color:rgba(43,36,22,.6);font-size:12px;margin-top:auto;border-top:1px dashed rgba(43,36,22,.2);padding-top:8px}
.note .icon-btn{color:rgba(43,36,22,.65)} .note .icon-btn:hover{background:rgba(0,0,0,.07);color:#2B2416} .note .icon-btn.on{color:#C62828}
.note .btn-danger{background:#C62828;border-color:#C62828;color:#fff}
.note.unfold{animation:unfold .6s cubic-bezier(.2,.8,.25,1.1)}
@keyframes unfold{0%{transform:perspective(700px) rotateX(-80deg) scale(.9);opacity:0}100%{transform:rotate(var(--tilt,-1deg));opacity:1}}
/* a new note arrives as a sealed envelope */
.env{position:relative;min-height:250px;border-radius:10px;background:#EFD9B4;color:#4A3214;box-shadow:0 12px 24px -10px rgba(80,50,10,.45);overflow:hidden;display:grid;place-items:end center;padding:18px;text-align:center;transform:rotate(var(--tilt,.8deg))}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),rgba(120,80,30,.25) 50%,transparent calc(50% + 1px)) left/50% 100% no-repeat,linear-gradient(to top left,transparent calc(50% - 1px),rgba(120,80,30,.25) 50%,transparent calc(50% + 1px)) right/50% 100% no-repeat}
.env-flap{position:absolute;inset:0 0 auto 0;height:42%;background:#E3C796;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.env-seal{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E5534B,#A61E1E 65%,#6E0F0F);color:#FFE9D6;display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.12);animation:seal 2.4s ease-in-out infinite}
@keyframes seal{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
.env-txt{position:relative;display:grid;gap:6px;justify-items:center}
.env-txt b{font-family:"Aref Ruqaa",var(--f-body);font-size:22px}
.env-txt small{font-size:12px;opacity:.75}
.env .btn{background:#4A3214;border-color:#4A3214;color:#FFF3E0}
.note-colors{display:flex;gap:10px;flex-wrap:wrap}
.note-colors label{display:inline-flex!important}
.note-colors input{position:absolute;opacity:0;width:1px;height:1px;min-height:0!important}
.note-colors span{width:38px;height:38px;border-radius:10px 10px 10px 4px;border:2px solid rgba(0,0,0,.1);box-shadow:0 2px 4px rgba(0,0,0,.1);transition:transform .15s}
.note-colors input:checked + span{transform:scale(1.12) rotate(-4deg);border-color:var(--ink)}
.note-colors input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:var(--backdrop)}
.sheet-panel{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:6px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:20px;padding:6px 22px 22px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-panel::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 0}
@media (min-width:700px){.sheet-panel::before{display:none}}
.sheet-backdrop{animation:fadeb .2s ease-out}@keyframes fadeb{from{opacity:0}}
.sheet-head h3{font-size:18px;font-family:var(--f-display);font-weight:600}
.form{display:grid;gap:14px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form label small{font-weight:400;color:var(--faint)}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);font-weight:500;min-height:44px}
.form textarea{min-height:110px;resize:vertical;line-height:1.6}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:10px;font-size:14px!important;color:var(--ink)!important;font-weight:500!important}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.form-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-top:4px}
.form-actions .main-acts{display:flex;gap:8px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.recipe{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 38px;gap:8px;align-items:center}
.rrow .unit{font-size:12px;color:var(--faint)}
.calc{background:var(--sunken);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.calc > div > span{display:block;color:var(--muted)}
.calc b{font-size:15px}
.radio-chips{display:flex;gap:8px;flex-wrap:wrap}
.radio-chips label{display:inline-flex;font-size:13px;color:var(--ink)}
.radio-chips input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.radio-chips span{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;background:var(--bg)}
.radio-chips input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.radio-chips input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- monthly schedule ---------- */
.day-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);padding:10px 16px;text-align:right;color:inherit}
.day-row + .day-row{border-top:1px solid var(--line)}
.day-row:hover{background:var(--sunken)}
.day-row.today{background:var(--accent-soft)}
.day-row.past{opacity:.62}
.day-date{min-width:56px;display:flex;flex-direction:column;line-height:1.25}
.day-date b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.day-date span{font-size:11px;color:var(--muted)}
.day-people{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:600;white-space:nowrap}
.day-edit{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hint{margin:0;color:var(--muted);font-size:13px}
.chip-s{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;background:var(--bg);color:var(--ink)}
.chip-s[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.weeknav strong{min-width:170px}

/* ---------- attendance ---------- */
.att-btns{display:inline-flex;background:var(--sunken);border-radius:11px;padding:3px;gap:2px;flex-shrink:0}
.att-btns button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);min-height:36px}
.att-btns button[aria-pressed="true"]{color:var(--on-accent)}
.att-btns button.p[aria-pressed="true"]{background:var(--good)}
.att-btns button.l[aria-pressed="true"]{background:var(--warn)}
.att-btns button.a[aria-pressed="true"]{background:var(--bad)}
.li.offday .li-title{color:var(--muted)}
.mini.absent{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.att-line{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line)}
.att-line b{color:var(--ink)}
.group-label{padding:8px 16px;background:var(--sunken);font-size:12px;font-weight:600;color:var(--muted)}
@media (max-width:520px){.li.att{flex-wrap:wrap}.li.att .att-btns{width:100%}.li.att .att-btns button{flex:1}}

/* ---------- people ---------- */
.who-pick{max-width:440px;margin:6vh auto 0;display:grid;gap:14px;text-align:center}
.who-pick h1{font-family:var(--f-display);font-weight:600;font-size:28px}
.who-pick .btn{min-height:58px;font-size:17px}
.author{font-size:11px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
.author.manager{background:var(--accent-soft);color:var(--accent)}
.author.sup{background:var(--sh-e);color:var(--sh-e-ink)}
.new-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent)}
.new-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;margin-inline-start:6px;vertical-align:middle}

@media (max-width:520px){
  .page-head h1{font-size:26px}
  .hero{padding:18px}
  .hero .big{font-size:32px}
  .hero-stats b,.month-tiles b{font-size:14px}
  .month-tiles div{padding:12px 10px}
  .stats b{font-size:16px}
  .cat-row{grid-template-columns:88px minmax(0,1fr) auto}
}

/* ---------- skin picker ---------- */
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skin{display:grid!important;gap:6px;justify-items:center;cursor:pointer}
.skin input{position:absolute;opacity:0;width:1px;height:1px;min-height:0!important}
.skin-sw{width:100%;height:64px;border-radius:14px;border:2px solid var(--line);display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:10px;transition:border-color .15s,transform .15s}
.skin-sw i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.skin input:checked + .skin-sw{border-color:var(--accent);transform:scale(1.04);box-shadow:0 0 0 3px var(--accent-soft)}
.skin b{font-size:13px;color:var(--ink)}
.skin input:focus-visible + .skin-sw{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- quick actions ---------- */
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
.quick button{display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 4px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .08s,border-color .15s}
.quick button:hover{border-color:var(--accent)}

<script>
(function(){
'use strict';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nn = v => Math.max(0, num(v));
const num = v => {
  if (v == null) return 0;
  const s = String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,،\s]/g,'');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
const round = (n, d = 3) => { const f = Math.pow(10, d); return Math.round((+n || 0) * f) / f; };
const sum = (arr, f) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
const fmt = n => Math.round(+n || 0).toLocaleString('en-US');
const fmtQ = n => (round(n, 2)).toLocaleString('en-US', {maximumFractionDigits: 2});
const IQD = n => `<span class="n">${fmt(n)}</span> <span class="cur">د.ع</span>`;
const NUM = n => `<span class="n">${n}</span>`;
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey = (d = new Date()) => dayKey(d).slice(0, 7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const DAYS = [['sat','السبت'],['sun','الأحد'],['mon','الاثنين'],['tue','الثلاثاء'],['wed','الأربعاء'],['thu','الخميس'],['fri','الجمعة']];
const DAYNAME = Object.fromEntries(DAYS);
const JSDAY = ['sun','mon','tue','wed','thu','fri','sat'];
const SHIFTS = {m:'صباحي', e:'مسائي', f:'دوام كامل', off:'عطلة'};
const SHIFT_SHORT = {m:'صباحي', e:'مسائي', f:'كامل', off:'عطلة'};
const SHIFT_ORDER = ['m','e','f','off'];
const UNITS = ['كغم','غرام','لتر','مل','قطعة','علبة','كيس','طبقة','قنينة'];
const CATS = ['مشتريات مواد','رواتب','إيجار','كهرباء ومولدة','غاز','ماء','صيانة','تنظيف','نقل','أخرى'];
const ROLES = ['طباخ','مساعد طباخ','كاشير','نادل','عامل توصيل','عامل تنظيف','مشرف'];
const TX = {advance:'سلفة', deduct:'خصم', bonus:'مكافأة'};
const monthLabel = m => { const [y, mo] = m.split('-'); return MONTHS[+mo - 1] + ' ' + y; };
const shiftMonth = (m, delta) => { const [y, mo] = m.split('-').map(Number); return monthKey(new Date(y, mo - 1 + delta, 1)); };
const dateOf = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = (d = new Date()) => dayKey(addDays(d, -((d.getDay() + 1) % 7)));
const dayLabel = (key, wd = true) => { const dt = dateOf(key); return (wd ? DAYNAME[JSDAY[dt.getDay()]] + ' ' : '') + dt.getDate() + ' ' + MONTHS[dt.getMonth()]; };

/* Writes go out immediately; only writes to the SAME document wait for each other.
   Until a write is confirmed, its result is laid over incoming snapshots so the screen never jumps back. */
const pend = {}, docQ = {};
function commit(path, next, op){
  const token = {}; pend[path] = {v:next, token};
  const p = (docQ[path] || Promise.resolve())
    .then(op)
    .then(() => true, e => { fail(e); return false; })
    .then(ok => { if (pend[path] && pend[path].token === token) delete pend[path]; return ok; });
  docQ[path] = p; return p;
}
const put = (path, data) => commit(path, data, () => db.doc(path).set(data));
const upd = (path, patch, full) => commit(path, full, () => db.doc(path).update(patch));
const del = path => commit(path, null, () => db.doc(path).delete());
/* merge into a document, creating it only if it really doesn't exist yet: a "new" day document may already exist
   on the server (written by the other phone a moment ago), and a plain set would wipe that */
const notFound = e => /not_found/.test(String((e && (e.message || e.code)) || ''));
const ups = (path, patch, full) => commit(path, full, () => db.doc(path).update(patch).catch(e => notFound(e) ? db.doc(path).set(full) : Promise.reject(e)));
function overlay(col, o){
  const pre = col + '/';
  for (const p in pend){
    if (!p.startsWith(pre)) continue;
    const id = p.slice(pre.length); if (id.includes('/')) continue;
    if (pend[p].v === null) delete o[id]; else o[id] = pend[p].v;
  }
  return o;
}

function onErr(e){ if (e && (e.code === 'revoked' || e.code === 'not_granted')) { S.offline = true; queueRender(); } }
function subCol(key, q, cov){

    if (cov) S.cov[key] = cov;
    const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); });
    S[key] = overlay(key, o); S.loaded.add(key); queueRender();
  }, onErr);
}

}

      <div class="week">${days.map((d, i) => `<div class="bar ${i === 6 ? 'today' : ''}" title="${d.wd}: ${fmt(d.v)} د.ع"><div class="track"><div class="fill" style="height:${Math.max(3, d.v / maxV * 100)}%"></div></div><span class="d">${i === 6 ? 'اليوم' : d.wd.replace(/^ال/, '')}</span></div>`).join('')}</div>
    </div>
  </section>

  ${openW.length ? `<section><div class="sec-head"><h2>${ic('scale')} شغل مفتوح</h2><span class="muted">اكتب المبيع آخر اليوم حتى يُحسب الربح</span></div><div class="al-list">${openW.map(alertRow).join('')}</div></section>` : ''}

  <nav class="quick" aria-label="إجراءات سريعة">
    ${q('tab="pos"', 'pos', 'بيع', 'av av0')}${q('act="add-sk"', 'shawarma', 'شيش', 'av av1')}${q('act="add-kfc"', 'kfc', 'كنتاكي', 'av av3')}${q('act="drink-day"', 'drinks', 'مشروبات', 'av av8')}${q('act="add-exp"', 'exp', 'مصروف', 'av av7')}${q('act="add-note"', 'notes', 'ملاحظة', 'av av2')}

  ${sk.length || kb.length || dr.length ? `<section>
    <div class="sec-head"><h2>${ic('meal')} أقسام اليوم</h2><span class="muted">الربح حسب القسم</span></div>

      ${kb.length ? `<button class="prod-card" data-tab="kfc" style="--k:var(--c-kfc)"><span class="av av3">${ic('kfc')}</span><span class="li-main"><b>الكنتاكي</b><small>${NUM(fmt(sum(kb, c => c.meals)))} وجبة · ${pcsW(sum(kb, c => c.soldPcs))}</small></span><b class="${sum(kb, c => c.profit) < 0 ? 'neg-v' : 'pos-v'}">${IQD(sum(kb, c => c.profit))}</b></button>` : ''}
      ${dr.length ? `<button class="prod-card" data-tab="drinks" style="--k:var(--c-drinks)"><span class="av av8">${ic('drinks')}</span><span class="li-main"><b>المشروبات</b><small>${cansW(sum(dr, r => r.sold))}${sum(dr, r => Math.max(0, +r.missing || 0)) ? ' · <span style="color:var(--bad)">ناقص ' + fmt(sum(dr, r => Math.max(0, +r.missing || 0))) + '</span>' : ''}</small></span><b class="pos-v">${IQD(sum(dr, drinkProfit))}</b></button>` : ''}

      <div class="sec-head"><h2>${ic('staff')} دوام اليوم · ${DAYNAME[tk]}</h2><button class="btn btn-ghost btn-sm" data-act="go-att">سجّل الحضور</button></div>

        <div class="att-line"><span>حاضر <b>${NUM(cP)}</b></span><span>غائب <b style="color:${cA ? 'var(--bad)' : 'inherit'}">${NUM(cA)}</b></span><span>لم يُسجَّل <b>${NUM(cN)}</b> من ${NUM(onToday)}</span></div></div>`

    ${notes.length ? `<div class="notes">${notes.map(([id, n]) => noteCard(id, n)).join('')}</div>` : `<div class="panel empty"><span>لا توجد ملاحظات بعد.</span></div>`}
  </section>`;
}

  const total = sum(lines, l => l.q * l.p);

        <div class="cart-foot">

function monthSchedView(staff){
  const [y, mo] = S.month.split('-').map(Number), n = new Date(y, mo, 0).getDate(), today = dayKey();
  const doc = S.sched[S.month] || {};
  const rows = [];
  for (let d = 1; d <= n; d++){
    const key = S.month + '-' + pad(d);

/* ---------- shawarma ----------
   One document per day: shawarma/YYYY-MM-DD {date, month, skewers:{id:{...}}}.
   Weights are stored in kg, money in IQD. Defaults per type live in settings/shawarma. */
const SH_TYPES = ['دجاج','لحم'];
const skewersOf = d => Object.entries((d && d.skewers) || {}).filter(([, x]) => x);
const shDefaults = () => (S.settings.shawarma && S.settings.shawarma.types) || {};
const shTypeNames = () => [...new Set([...SH_TYPES, ...Object.keys(shDefaults()), ...Object.values(S.shawarma).flatMap(d => skewersOf(d).map(([, x]) => x.type))].filter(Boolean))];
const kgOf = (it, kg) => it && it.unit === 'غرام' ? kg * 1000 : kg;
const fmtKgT = kg => { kg = +kg || 0; return Math.abs(kg) < 1 && kg !== 0 ? fmt(kg * 1000) + ' غ' : fmtQ(kg) + ' كغم'; };
const fmtKg = kg => { kg = +kg || 0; return Math.abs(kg) < 1 && kg !== 0 ? NUM(fmt(kg * 1000)) + ' غ' : NUM(fmtQ(kg)) + ' كغم'; };
const lafa = n => { n = Math.round(+n || 0); const w = n === 1 ? 'لفة' : n === 2 ? 'لفتين' : n >= 3 && n <= 10 ? 'لفات' : 'لفة'; return n === 2 ? w : NUM(fmt(n)) + ' ' + w; };
const matCost = r => (r.c != null ? +r.c : (S.items[r.i] ? +S.items[r.i].cost || 0 : 0)) * (+r.q || 0);
function shCalc(x){
  const w = +x.w || 0, wraps = +x.wraps || 0, staff = +x.staff || 0, gpw = +x.gpw || 0, pz = +x.pz || 0, left = Math.min(+x.left || 0, w);
  const meat = w * (+x.kgp || 0);
  const mats = sum(x.mats || [], matCost) + (+x.other || 0);
  const base = meat + mats;                                   // what the whole skewer cost
  const wrapsKg = wraps * gpw / 1000, staffKg = staff * gpw / 1000;     // staff dinner wraps: cost, no income
  const served = wrapsKg + staffKg + pz;
  const loss = Math.max(0, w - served - left);                // shrinkage + waste
  const over = Math.max(0, served + left - w);
  const usedBase = w > 0 ? base * (w - left) / w : 0;         // the leftover carries its share to tomorrow
  const kgCost = served > 0 ? usedBase / served : (w > 0 ? base / w : 0);
  const pzp = +x.pzp > 0 ? +x.pzp : kgCost;                   // no price for the pizza → hand it over at cost
  const wrapsRev = wraps * (+x.price || 0), pzRev = pz * pzp;
  const extras = (wraps + staff) * (+x.extra || 0);
  const cost = usedBase + extras, rev = wrapsRev + pzRev;
  const wrapCost = kgCost * gpw / 1000 + (+x.extra || 0);
  return {w, wraps, staff, staffKg, staffCost: kgCost * staffKg + staff * (+x.extra || 0), gpw, pz, left, meat, mats, base, wrapsKg, served, loss, over, lossPct: w ? loss / w * 100 : 0,
    cost, rev, profit: rev - cost, wrapCost, kgCost, pzp, pzRev, wrapsRev, open: !wraps && !pz && !staff};
}
/* average real loss of finished skewers of this type, so the estimate learns from the restaurant's own numbers */
function avgLoss(type, skip){
  const xs = Object.values(S.shawarma).flatMap(d => skewersOf(d)).filter(([id, x]) => id !== skip && x.type === type && +x.wraps > 0).map(([, x]) => shCalc(x)).filter(c => c.w > 0 && !c.over && c.lossPct <= 60);
  return xs.length ? {pct: sum(xs, c => c.lossPct) / xs.length, n: xs.length} : null;
}
function shExpect(x, c, exl){
  const net = c.w * (1 - exl / 100) - c.pz - c.left;
  const wraps = c.gpw > 0 ? Math.max(0, Math.floor(net * 1000 / c.gpw)) : 0;
  return {wraps, worth: wraps * (+x.price || 0) + c.pzRev, gap: c.open ? 0 : wraps - c.wraps - c.staff};
}
const shExl = (x, skip) => { if (x.exl !== '' && x.exl != null && isFinite(+x.exl)) return +x.exl; const a = avgLoss(x.type, skip); return a ? Math.round(a.pct) : 30; };

function skCard(r){
  const {x, c} = r, tot = Math.max(c.w, c.served + c.left) || 1;
  const segs = [['seg-w', c.wrapsKg], ['seg-s', c.staffKg], ['seg-p', c.pz], ['seg-l', c.left], ['seg-x', c.loss]].filter(s => s[1] > 0);
  const ex = shExpect(x, c, shExl(x, r.id));
  return `<article class="sk" data-act="edit-sk" data-id="${esc(r.id)}" data-date="${esc(r.date)}">
    <div class="sk-top"><span class="av av1">${ic('shawarma')}</span>
      <div class="li-main"><div class="li-title">شيش ${esc(x.type)} · ${fmtKg(c.w)}</div>
        <div class="li-meta">${c.open ? 'المتوقع ' + lafa(ex.wraps) : lafa(c.wraps) + ' × ' + NUM(fmt(c.gpw)) + ' غ'}${x.note ? ' · ' + esc(x.note) : ''}</div></div>
      ${c.open ? '<span class="pill low">على الشيش</span>' : c.over ? '<span class="pill out">الأوزان أكثر من الشيش</span>' : `<span class="pill plain ${c.lossPct > 40 ? 'out' : c.lossPct > 32 ? 'low' : 'ok'}">فقد ${NUM(Math.round(c.lossPct) + '%')}</span>`}
      <button class="icon-btn" data-act="edit-sk" data-id="${esc(r.id)}" data-date="${esc(r.date)}" aria-label="تعديل">${ic('edit')}</button></div>
    ${c.w ? `<div class="sk-bar" aria-hidden="true">${segs.map(([k, v]) => `<i class="${k}" style="width:${v / tot * 100}%"></i>`).join('')}</div>
    <div class="sk-legend">${c.wrapsKg ? `<span><i class="seg-w"></i>لفات ${fmtKg(c.wrapsKg)}</span>` : ''}${c.staff ? `<span><i class="seg-s"></i>العمال ${lafa(c.staff)}</span>` : ''}${c.pz ? `<span><i class="seg-p"></i>البيتزا ${fmtKg(c.pz)}</span>` : ''}${c.left ? `<span><i class="seg-l"></i>باقي ${fmtKg(c.left)}</span>` : ''}${c.loss && !c.open ? `<span><i class="seg-x"></i>فقد ${fmtKg(c.loss)}</span>` : ''}</div>` : ''}
    ${!c.open && ex.gap > 0 ? `<div class="warn-note">حسب الوزن كان المفروض ${lafa(ex.wraps)}، يعني ناقص ${lafa(ex.gap)} ≈ ${IQD(ex.gap * (+x.price || 0))}</div>` : ''}
    <div class="sk-money"><div><span>${c.open ? 'يسوى تقريباً' : 'الإيراد'}</span><b>${IQD(c.open ? ex.worth : c.rev)}</b></div><div><span>التكلفة</span><b>${IQD(c.open ? c.base : c.cost)}</b></div>
      <div><span>${c.open ? 'كلفة اللفة' : 'الربح'}</span><b class="${c.open ? '' : c.profit < 0 ? 'neg-v' : 'pos-v'}">${IQD(c.open ? c.wrapCost : c.profit)}</b></div></div>
  </article>`;

  const days = Object.values(S.shawarma).filter(d => d && d.month === S.month && d.date).sort((a, b) => b.date.localeCompare(a.date));
  const all = days.flatMap(d => skewersOf(d).map(([id, x]) => ({id, x, date:d.date, c:shCalc(x)}))).sort((a, b) => (b.x.t || 0) - (a.x.t || 0));
  const types = [...new Set(all.map(r => r.x.type))];
  if (S.shType !== 'all' && !types.includes(S.shType)) S.shType = 'all';
  const list = all.filter(r => S.shType === 'all' || r.x.type === S.shType);
  const done = list.filter(r => !r.c.open);
  const T = f => sum(done, r => f(r.c));
  const lossAvg = done.filter(r => r.c.w).length ? sum(done.filter(r => r.c.w), r => r.c.lossPct) / done.filter(r => r.c.w).length : 0;
  const f = (k, l) => `<button class="chip" data-act="sk-type" data-t="${esc(k)}" aria-pressed="${S.shType === k}">${esc(l)}</button>`;
  const groups = {}; list.forEach(r => { (groups[r.date] = groups[r.date] || []).push(r); });
  const top = head('الشاورما', 'الوزن واللفات وحصة البيتزا والربح', `<div class="chips"><button class="btn" data-act="sh-recipe">${ic('leaf')} الوصفات</button><button class="btn btn-primary" data-act="add-sk">${ic('plus')} شيش جديد</button></div>`);
  if (!all.length) return top + `<div>${monthNav()}</div><div class="panel empty"><span class="av av1" style="width:56px;height:56px;border-radius:16px">${ic('shawarma')}</span><strong>لا يوجد شيش مسجّل في ${monthLabel(S.month)}</strong>
    <span>سجّل وزن الشيش وسعره ومواده، وبآخر اليوم اكتب عدد اللفات وكم راح لأبو البيتزا. التطبيق يحسب الكلفة والربح والفقد، وكم لفة كان المفروض يطلع منه.</span>
    <button class="btn btn-primary" data-act="add-sk">${ic('plus')} سجّل أول شيش</button></div>`;
  const meatIds = [...new Set(Object.values(shDefaults()).map(d => d && d.item).filter(i => i && S.items[i]))];
  const stores = meatIds.length ? `<div class="stores">${meatIds.map(i => storeCard(i, 'مخزن ' + S.items[i].name, 'shawarma')).join('')}</div>` : '';
  const byType = types.map(t => { const xs = all.filter(r => r.x.type === t && !r.c.open); return {t, n:all.filter(r => r.x.type === t).length, xs}; });
  return top + `
  ${stores}
  <div class="sec-head" style="margin:0;flex-wrap:wrap">${monthNav()}${types.length > 1 ? `<div class="chips">${f('all', 'الكل')}${types.map(t => f(t, t)).join('')}</div>` : ''}</div>
  <section class="hero" aria-label="ملخص الشهر">
    <div><div class="lbl">ربح الشاورما · ${monthLabel(S.month)} <span style="opacity:.75">(ربح المواد، قبل الرواتب والإيجار)</span></div><div class="big">${IQD(T(c => c.profit))}</div>
      <div class="hero-stats" style="margin-top:14px"><div><span class="lbl">الإيراد</span><b>${IQD(T(c => c.rev))}</b></div><div><span class="lbl">التكلفة</span><b>${IQD(T(c => c.cost))}</b></div><div><span class="lbl">اللفات</span><b>${NUM(fmt(T(c => c.wraps)))}</b></div></div></div>
    <div class="hero-stats"><div><span class="lbl">الشيشات</span><b>${NUM(list.length)}</b></div><div><span class="lbl">الوزن الكلي</span><b>${fmtKg(sum(list, r => r.c.w))}</b></div><div><span class="lbl">لأبو البيتزا</span><b>${fmtKg(T(c => c.pz))}</b></div>
      <div><span class="lbl">متوسط الفقد</span><b>${NUM(Math.round(lossAvg) + '%')}</b></div><div><span class="lbl">لفات العمال</span><b>${NUM(fmt(T(c => c.staff)))} <span class="cur">· ${fmt(T(c => c.staffCost))} د.ع</span></b></div><div><span class="lbl">كلفة اللفة</span><b>${IQD(sum(done, r => r.c.wraps) ? sum(done, r => r.c.wrapCost * r.c.wraps) / sum(done, r => r.c.wraps) : 0)}</b></div></div>
  </section>
  ${byType.length > 1 || byType.some(b => b.xs.length) ? `<section><div class="sec-head"><h2>${ic('scale')} حسب النوع</h2><span class="muted">للشيشات المكتملة</span></div><div class="list">${byType.map(b => { const n = b.xs.length || 1;
    return `<div class="type-card"><span class="${avc(b.t)}">${ini(b.t)}</span><div class="li-main"><div class="li-title">${esc(b.t)} · ${NUM(b.n)} شيش</div>
      <div class="li-meta">معدل ${NUM(fmt(sum(b.xs, r => r.c.wraps) / n))} لفة للشيش · فقد ${NUM(Math.round(sum(b.xs, r => r.c.lossPct) / n) + '%')} · كلفة اللفة ${IQD(sum(b.xs, r => r.c.wraps) ? sum(b.xs, r => r.c.wrapCost * r.c.wraps) / sum(b.xs, r => r.c.wraps) : 0)}</div></div>
      <div class="li-end"><b class="${sum(b.xs, r => r.c.profit) < 0 ? 'neg-v' : 'pos-v'}">${IQD(sum(b.xs, r => r.c.profit))}</b></div></div>`; }).join('')}</div></section>` : ''}
  ${Object.entries(groups).map(([d, rs]) => `<section><div class="sec-head"><h2>${d === dayKey() ? 'اليوم · ' : ''}${dayLabel(d)}</h2><span class="muted">${rs.some(r => !r.c.open) ? 'الربح ' + fmt(sum(rs.filter(r => !r.c.open), r => r.c.profit)) + ' د.ع' : ''}</span></div>
    <div class="sk-list">${rs.map(skCard).join('')}</div></section>`).join('')}`;
}

/* ---------- KFC ----------

const kfcSet = () => S.settings.kfc || {};

function avgYield(skip){

  return xs.length ? {v: sum(xs, v => v) / xs.length, n: xs.length} : null;
}

  </section>

  ${Object.entries(groups).map(([d, rs]) => `<section><div class="sec-head"><h2>${d === dayKey() ? 'اليوم · ' : ''}${dayLabel(d)}</h2><span class="muted">${rs.some(r => !r.c.open) ? 'الربح ' + fmt(sum(rs.filter(r => !r.c.open), r => r.c.profit)) + ' د.ع' : ''}</span></div>
    <div class="sk-list">${rs.map(kfcCard).join('')}</div></section>`).join('')}`;
}

function openKfcMeals(){
  const rows = kfcMeals();
  const row = (id, m) => `<div class="meal-row" data-id="${esc(id || '')}"><input class="m-name" maxlength="30" value="${esc(m ? m.name : '')}" placeholder="اسم الوجبة" aria-label="اسم الوجبة"><input class="m-pcs" inputmode="numeric" value="${m ? m.pcs : ''}" placeholder="قطع" aria-label="عدد القطع"><input class="m-price" inputmode="numeric" value="${m && +m.price ? m.price : ''}" placeholder="السعر" aria-label="السعر"><input class="m-extra" inputmode="numeric" value="${m && +m.extra ? m.extra : ''}" placeholder="إضافات" aria-label="كلفة الإضافات"><button type="button" class="icon-btn m-del" aria-label="حذف الوجبة">${ic('x')}</button></div>`;
  const seed = [['وجبة 2 قطع', 2], ['وجبة 4 قطع', 4], ['بوكس عائلي 8 قطع', 8]];
  openSheet('الوجبات والأسعار', `<form class="form" novalidate>
    <p class="hint">لكل وجبة: عدد القطع، سعر البيع، وكلفة الإضافات للوجبة الواحدة (بطاطا، خبز، صوص، علبة).</p>
    <div class="meal-head"><span>الوجبة</span><span>قطع</span><span>السعر</span><span>إضافات</span><span></span></div>
    <div id="meals" class="recipe">${rows.length ? rows.map(([id, m]) => row(id, m)).join('') : seed.map(([n, p]) => row('', {name:n, pcs:p})).join('')}</div>
    <button type="button" class="btn btn-sm" id="meal-add" style="justify-self:start">${ic('plus')} وجبة</button>
    ${formActions()}</form>`, body => {
    const box = body.querySelector('#meals');
    body.querySelector('#meal-add').addEventListener('click', () => box.insertAdjacentHTML('beforeend', row('', null)));
    box.addEventListener('click', e => { const b = e.target.closest('.m-del'); if (b) b.closest('.meal-row').remove(); });
    bindForm(body, async f => {
      const meals = {};
      for (const r of box.querySelectorAll('.meal-row')){
        const name = r.querySelector('.m-name').value.trim(), pcs = Math.round(num(r.querySelector('.m-pcs').value)), price = Math.round(num(r.querySelector('.m-price').value));
        if (!name && !pcs && !price) continue;
        if (!name) return setErr(f, 'اكتب اسم كل وجبة.');
        if (pcs <= 0) return setErr(f, 'اكتب عدد القطع في ' + name + '.');
        if (price <= 0) return setErr(f, 'اكتب سعر ' + name + '.');
        meals[r.dataset.id || uid()] = {name, pcs, price, extra:Math.round(num(r.querySelector('.m-extra').value))};
      }
      if (!Object.keys(meals).length) return setErr(f, 'أضف وجبة واحدة على الأقل.');
      const removed = Object.fromEntries(Object.keys(kfcSet().meals || {}).filter(k => !meals[k]).map(k => [k, null]));
      const cur = S.settings.kfc, full = Object.assign({}, cur || {}, {meals});
      closeSheet(); S.settings = Object.assign({}, S.settings, {kfc:full}); render();
      if (await (cur ? upd('settings/kfc', {meals:Object.assign({}, removed, meals)}, full) : ups('settings/kfc', full, full))) toast('تم حفظ الوجبات');
    });
  });
}

      .map(r => { const o = (old && old.mats || []).find(m => m.i === r.i); return Object.assign(r, {c: o && o.c != null ? o.c : Math.round(+S.items[r.i].cost || 0)}); }) : [];

    };

      return `<span class="av av3">${ic('kfc')}</span><div class="li-main"><b>${+y.hens ? fmt(y.hens) + ' دجاجة · ' : ''}${fmtKg(y.w)} · ${pcsW(y.pcs)}</b><small>كلّفت ${IQD(c.base)}${c.pcs ? ' · القطعة ' + IQD(c.pcCost) : ''}</small></div><button type="button" class="btn btn-sm btn-ghost" data-ph-jump>تعديل</button>`; });

      if (old && date !== dt) jobs.push(kfcWrite(date, bid, null));
      jobs.push(kfcWrite(dt, bid, data));
      const diff = {}, prev = (old && old.stk) || {};
      new Set([...Object.keys(stk), ...Object.keys(prev)]).forEach(k => { const dq = round((stk[k] || 0) - (prev[k] || 0)); if (dq) diff[k] = dq; });
      applyStock(diff, -1);
      const cur = S.settings.kfc, defs = {kgp:y.kgp, item:y.item, per:y.per, mats:y.mats.map(r => ({i:r.i, q:r.q})), other:y.other};
      const full = Object.assign({}, cur || {}, defs); S.settings = Object.assign({}, S.settings, {kfc:full});
      cur ? upd('settings/kfc', defs, full) : ups('settings/kfc', full, full);
      if (dt.slice(0, 7) !== S.month){ S.month = dt.slice(0, 7); subMonth(); }
      render();
      if ((await Promise.all(jobs)).every(Boolean)){ const c = kfcCalc(data); toast(c.open ? 'تم حفظ الدفعة · ' + fmtKgT(y.w) : 'تم الحفظ · الربح ' + fmt(c.profit) + ' د.ع'); }
    });

      const p = kfcWrite(date, id, null); render();
      if (await p) toast('تم حذف الدفعة' + (Object.keys(old.stk || {}).length ? ' وأُعيدت موادها للمخزون' : ''));
    });
  });
}
function kfcWrite(date, bid, data){
  const cur = S.kfc[date], path = 'kfc/' + date;
  let body, p;
  if (cur && cur.batches){
    body = Object.assign({}, cur, {batches:Object.assign({}, cur.batches, {[bid]:data})});
    p = upd(path, {batches:{[bid]:data}}, body);
  } else {
    if (!data) return Promise.resolve(true);
    body = {date, month:date.slice(0, 7), batches:{[bid]:data}};
    p = ups(path, body, body);
  }
  S.kfc = Object.assign({}, S.kfc, {[date]:body});
  return p;
}

/* ---------- drinks ----------
   drinks/{id} {name, per (cans per carton), cartonCost, price (per can), qty (cans), min}
   drinklog/YYYY-MM-DD {date, month, rows:{drinkId:{start, sold, cartons, bought, count|null, end, missing, price, unit}}}
   A day row moves stock from start to end; editing a day shifts the drink's stock by the change in end. */
const drinkList = () => sortByName(S.drinks);
const unitCost = d => (+d.per || 0) ? (+d.cartonCost || 0) / (+d.per) : 0;
const cansW = n => { n = Math.round(+n || 0); const a = Math.abs(n); return a === 1 ? 'قوطية' : a === 2 ? 'قوطيتين' : NUM(fmt(n)) + (a >= 3 && a <= 10 ? ' قوطيات' : ' قوطية'); };
const cartonsLabel = (q, per) => { q = Math.round(+q || 0); per = +per || 0; if (!per || q < per || q < 0) return cansW(q); const c = Math.floor(q / per), r = q % per; return NUM(fmt(c)) + ' كارتون' + (r ? ' + ' + cansW(r) : ''); };
const logRows = d => Object.entries((d && d.rows) || {}).filter(([, r]) => r);
const drinkRev = r => (+r.sold || 0) * (+r.price || 0);
const drinkProfit = r => (+r.sold || 0) * ((+r.price || 0) - (+r.unit || 0));
const DRINK_SUGG = ['ببسي','سفن أب','ميرندا','ماونتن ديو','كولا','ماء','عصير','لبن','مشروب طاقة'];

function drinksView(){

        <span class="meter ${st}"><i style="width:${Math.max(0, Math.min(100, (+d.min ? q / (d.min * 3) : q > 0 ? 1 : 0) * 100))}%"></i></span>

        <span class="day-people">${logRows(d).map(([id, r]) => `<span class="mini" style="background:var(--sunken)">${esc(r.name || (S.drinks[id] && S.drinks[id].name) || '')} ${NUM(fmt(r.sold))}${+r.cartons ? ' · +' + r.cartons + ' كارتون' : ''}</span>`).join('')}</span>
        <span class="li-end" style="flex-direction:column;align-items:flex-end;gap:2px"><b>${IQD(sum(rs, drinkRev))}</b>${miss ? `<span class="small" style="color:var(--bad)">ناقص ${cansW(miss)}</span>` : '<span class="small" style="color:var(--good)">مضبوط ✓</span>'}</span></button>`; }).join('')}</div>`

  const log = S.drinklog[date], rows = (log && log.rows) || {};
  const minM = [S.month, shiftMonth(S.cur, -1)].sort()[0];
  const expId = 'drink-' + date, hadExp = !!S.expenses[expId];
  openSheet('مشروبات ' + dayLabel(date), `<form class="form" novalidate>

        <div class="row3"><label>بعت (قوطية)<input class="d-sold" inputmode="numeric" value="${r && +r.sold ? r.sold : ''}" placeholder="0"></label>
          <label>اشتريت (كارتون)<input class="d-buy" inputmode="decimal" value="${r && +r.cartons ? r.cartons : ''}" placeholder="0"></label>
          <label>العدد الموجود<input class="d-count" inputmode="numeric" value="${r && r.count != null ? r.count : ''}" placeholder="اختياري"></label></div>
        <p class="hint d-res"></p></div>`; }).join('')}
    <label class="check"><input type="checkbox" id="f-exp" ${hadExp || !log ? 'checked' : ''}> سجّل مبلغ الكراتين المشتراة في المصاريف</label>

    $f('#f-date').addEventListener('change', () => { const nd = $f('#f-date').value; if (nd && nd !== date){ closeSheet(); openDrinkDay(nd); } });
    const read = () => [...body.querySelectorAll('.dd')].map(el => {
      const id = el.dataset.id, d = S.drinks[id], old = rows[id], per = +d.per || 0;
      const start = old ? +old.start : (+d.qty || 0);
      const sold = Math.round(nn(el.querySelector('.d-sold').value)), cartons = round(nn(el.querySelector('.d-buy').value), 2), bought = Math.round(cartons * per);
      const cRaw = el.querySelector('.d-count').value.trim(), count = cRaw === '' ? null : Math.round(nn(cRaw));
      const expected = start + bought - sold, end = count == null ? expected : count;
      return {id, d, el, old, row:{name:d.name, per, start, sold, cartons, bought, count, expected, end, missing: count == null ? 0 : expected - count, price:+d.price || 0, unit:Math.round(unitCost(d))},
        used: sold > 0 || cartons > 0 || count != null};
    });
    const calc = () => {
      const xs = read();
      xs.forEach(x => { const r = x.row; x.el.querySelector('.d-res').innerHTML = !x.used ? '' :
        `المفروض يكون ${cartonsLabel(r.expected, r.per)}` + (r.count == null ? '' : r.missing > 0 ? ` · العد ${cansW(r.count)} · <b style="color:var(--bad)">ناقص ${cansW(r.missing)} ≈ ${IQD(r.missing * r.price)}</b>` : r.missing < 0 ? ` · العد ${cansW(r.count)} · <b style="color:var(--warn)">زايد ${cansW(-r.missing)}</b>` : ' · <b style="color:var(--good)">مضبوط ✓</b>'); });
      const u = xs.filter(x => x.used).map(x => x.row);
      $f('#calc').innerHTML = `<div><span>المبيع</span><b>${IQD(sum(u, drinkRev))}</b></div><div><span>الربح</span><b class="pos-v">${IQD(sum(u, drinkProfit))}</b></div><div><span>النقص</span><b class="${sum(u, r => Math.max(0, r.missing)) ? 'neg-v' : ''}">${IQD(sum(u, r => Math.max(0, r.missing) * r.price))}</b></div>
        <div><span>القوطيات</span><b>${NUM(fmt(sum(u, r => r.sold)))}</b></div><div><span>المشتريات</span><b>${IQD(sum(xs.filter(x => x.used), x => x.row.cartons * (+x.d.cartonCost || 0)))}</b></div><div><span>الكراتين</span><b>${NUM(fmtQ(sum(u, r => r.cartons)))}</b></div>`;
    };
    body.addEventListener('input', calc); calc();
    bindForm(body, async f => {
      const xs = read(), patch = {}, full = {}, wantExp = $f('#f-exp').checked;
      let any = false;
      for (const x of xs){
        if (x.row.sold < 0 || x.row.cartons < 0) return setErr(f, 'الأرقام لا تكون بالسالب.');
        const prevEnd = x.old ? +x.old.end : (+x.d.qty || 0);
        if (x.used){ const r = Object.assign({}, x.row); delete r.expected; patch[x.id] = r; full[x.id] = r; any = true; }
        else if (x.old) patch[x.id] = null;
        const newEnd = x.used ? x.row.end : (x.old ? +x.old.start : prevEnd);
        const dq = newEnd - prevEnd;
        if (dq){ const nd = Object.assign({}, x.d, {qty:(+x.d.qty || 0) + dq}); S.drinks = Object.assign({}, S.drinks, {[x.id]:nd}); upd('drinks/' + x.id, {qty:nd.qty}, nd); }
      }
      closeSheet();
      const path = 'drinklog/' + date, keep = Object.assign({}, Object.fromEntries(logRows(log)), full);
      Object.keys(patch).forEach(k => { if (patch[k] === null) delete keep[k]; });
      let p;
      if (log){ const body2 = Object.assign({}, log, {rows:Object.assign({}, log.rows, patch)}); S.drinklog = Object.assign({}, S.drinklog, {[date]:body2}); p = upd(path, {rows:patch}, body2); }
      else if (any){ const body2 = {date, month:date.slice(0, 7), rows:full}; S.drinklog = Object.assign({}, S.drinklog, {[date]:body2}); p = ups(path, body2, body2); }
      else p = Promise.resolve(true);
      const buy = Math.round(sum(xs.filter(x => x.used), x => x.row.cartons * (+x.d.cartonCost || 0)));
      if (wantExp && buy > 0){
        const ex = {date, month:date.slice(0, 7), cat:'مشروبات', amount:buy, note:xs.filter(x => x.used && x.row.cartons).map(x => x.d.name + ' ' + fmtQ(x.row.cartons) + ' كارتون').join('، '), t:(S.expenses[expId] && S.expenses[expId].t) || Date.now(), drinks:true};
        S.expenses = Object.assign({}, S.expenses, {[expId]:ex}); put('expenses/' + expId, ex);
      } else if (hadExp){ const c = Object.assign({}, S.expenses); delete c[expId]; S.expenses = c; del('expenses/' + expId); }
      render();
      if (await p){ const u = Object.values(keep); const miss = sum(u, r => Math.max(0, +r.missing || 0)); toast(miss ? 'تم الحفظ · ناقص ' + miss + (miss >= 3 && miss <= 10 ? ' قوطيات' : ' قوطية') : 'تم الحفظ · ربح ' + fmt(sum(u, drinkProfit)) + ' د.ع'); }
    });
  });
}

/* ---------- feasts & big orders ----------
   feasts/{id} {name, phone, occ, date, time, place, mode, items:[{k, ref, name, q, price}], disc, paid, status, toSales, note, t, sale:{day,id}, dstk}
   status: booked → prep → done (or cancel). On «done» the order can land in that day's sales and drinks leave the drinks stock. */
const OCC = ['عرس','عزيمة','فاتحة','دائرة أو شركة','تخرج','عيد ميلاد','أخرى'];
const FST = {booked:'محجوزة', prep:'قيد التحضير', done:'تم التسليم', cancel:'ملغاة'};
const feastTotal = f => Math.max(0, Math.round(sum(toArr(f.items), i => (+i.q || 0) * (+i.price || 0)) - (+f.disc || 0)));
const feastLeft = f => Math.max(0, feastTotal(f) - (+f.paid || 0));
function feastCatalog(){
  const c = [];
  Object.entries(shDefaults()).forEach(([t, d]) => { if (d && +d.price) c.push({k:'sh', ref:t, name:'لفة شاورما ' + t, price:+d.price}); });
  kfcMeals().forEach(([id, m]) => c.push({k:'kfc', ref:id, name:m.name, price:+m.price}));
  sortByName(S.dishes).forEach(([id, d]) => c.push({k:'dish', ref:id, name:d.name, price:+d.price || 0}));
  drinkList().forEach(([id, d]) => c.push({k:'drink', ref:id, name:d.name + ' (قوطية)', price:+d.price || 0}));
  return c;
}
/* what the kitchen has to prepare, checked against the stores */
function feastPlan(f){
  const P = [];
  toArr(f.items).forEach(i => {
    const q = +i.q || 0; if (!q) return;
    if (i.k === 'sh'){
      const d = shDefaults()[i.ref] || {}, gpw = +d.gpw || 0; if (!gpw) return;
      const a = avgLoss(i.ref), loss = a ? a.pct : 30, raw = q * gpw / 1000 / (1 - loss / 100), it = d.item && S.items[d.item];
      P.push({ic:'shawarma', k:'shawarma', t:`شيش ${i.ref} ~${fmtQ(Math.ceil(raw * 2) / 2)} كغم`, m:`${fmt(q)} لفة × ${fmt(gpw)} غ، بعد فقد ${Math.round(loss)}%`, short: it && kgOf(it, raw) > (+it.qty || 0) ? `بالمخزن ${fmtQ(it.qty)} ${it.unit} فقط` : ''});
    } else if (i.k === 'kfc'){
      const m = (kfcSet().meals || {})[i.ref]; if (!m) return;
      const pcs = q * (+m.pcs || 0), per = +kfcSet().per || 8, hens = Math.ceil(pcs / per), hw = henW(), it = kfcSet().item && S.items[kfcSet().item];
      P.push({ic:'kfc', k:'kfc', t:`${fmt(hens)} دجاجة (${fmt(pcs)} قطعة)`, m:`${fmt(q)} × ${m.name}${hw ? ' · ~' + fmtQ(hens * hw) + ' كغم' : ''}`, short: it && hw && kgOf(it, hens * hw) > (+it.qty || 0) ? `بالمخزن ${fmtQ(it.qty)} ${it.unit} فقط` : ''});
    } else if (i.k === 'drink'){
      const d = S.drinks[i.ref]; if (!d) return;
      P.push({ic:'drinks', k:'drinks', t:`${fmt(q)} ${d.name}`, m:+d.per ? `≈ ${fmtQ(Math.ceil(q / d.per * 10) / 10)} كارتون` : '', short: f.status !== 'done' && q > (+d.qty || 0) ? `الموجود ${fmt(d.qty)} قوطية فقط` : ''});
    }
  });
  return P;
}
const daysTo = date => Math.round((dateOf(date) - dateOf(dayKey())) / 864e5);
const countdown = date => { const n = daysTo(date); return n < 0 ? 'فات موعدها' : n === 0 ? 'اليوم 🔥' : n === 1 ? 'غداً' : n === 2 ? 'بعد يومين' : 'بعد ' + n + ' أيام'; };
function feastCard(id, f){

async function setFeastStatus(id, st){

      const day = dayKey(), oid = 'feast-' + id, total = feastTotal(f);
      const order = {id:oid, t:Date.now(), lines:toArr(f.items).filter(i => +i.q).map(i => ({d:i.k === 'dish' ? i.ref : '', n:i.name, q:i.q, p:i.price})), total, feast:id, note:'طلبية ' + f.name};
      if (+f.disc) order.lines.push({d:'', n:'خصم', q:1, p:-(+f.disc)});
      const cur = S.sales[day], body = Object.assign({date:day, month:day.slice(0, 7)}, cur || {}, {orders:Object.assign({}, (cur && !Array.isArray(cur.orders) && cur.orders) || {}, {[oid]:order})});

      cur ? upd('sales/' + day, {orders:{[oid]:order}}, body) : ups('sales/' + day, {date:day, month:day.slice(0, 7), orders:{[oid]:order}}, body);
      full.sale = {day, id:oid};

    }
    const dstk = {};

    Object.entries(dstk).forEach(([did, q]) => { const d = S.drinks[did], nd = Object.assign({}, d, {qty:(+d.qty || 0) - q}); S.drinks = Object.assign({}, S.drinks, {[did]:nd}); upd('drinks/' + did, {qty:nd.qty}, nd); });

      if (o){ const body = Object.assign({}, doc, {orders:Object.assign({}, doc.orders, {[f.sale.id]:null})}); S.sales = Object.assign({}, S.sales, {[f.sale.day]:body}); upd('sales/' + f.sale.day, {orders:{[f.sale.id]:null}}, body); applyStock(consumption(o.lines.filter(l => S.dishes[l.d])), +1); }
    }

}

const USE_DAYS = 14;

  Object.values(S.kfc).forEach(d => batchesOf(d).forEach(([, x]) => Object.entries(x.stk || {}).forEach(([i, q]) => add(d.date, i, q))));

}
function avgPerDay(byDate){

const henW = () => { const xs = Object.values(S.kfc).flatMap(d => batchesOf(d)).map(([, x]) => x).filter(x => +x.hens > 0 && +x.w > 0); return xs.length ? sum(xs, x => +x.w) / sum(xs, x => +x.hens) : 0; };

function allAlerts(){
  if (!ready()) return [];
  const A = [], use = usageLog(), today = dayKey();
  sortByName(S.items).forEach(([id, it]) => {
    const q = +it.qty || 0, st = statusOf(it), du = itemUse(use, id), dl = du > 0 ? q / du : Infinity;
    const meta = `باقي ${fmtQ(q)} ${it.unit}` + (du ? ` · تستهلك ~${fmtQ(du)} ${it.unit} باليوم` : '');
    if (st === 'out') A.push({lvl:3, k:'inv', t:it.name + ' نفد', m:meta, act:'buy', id, b:'شراء'});
    else if (st === 'low' || dl < 3) A.push({lvl:dl < 1 ? 3 : 2, k:'inv', t:it.name + ' · ' + (dl < 3 ? daysText(dl) : 'منخفض'), m:meta, act:'buy', id, b:'شراء'});
  });
  drinkList().forEach(([id, d]) => {
    const q = +d.qty || 0, du = drinkUse(id), dl = du > 0 ? q / du : Infinity, low = q > 0 && q < (+d.min || 0);
    const meta = `باقي ${cartonsLabel(q, d.per).replace(/<[^>]+>/g, '')}` + (du ? ` · تبيع ~${Math.round(du)} قوطية باليوم` : '');
    if (q <= 0) A.push({lvl:3, k:'drinks', t:d.name + ' خلص', m:meta, act:'drink-day', b:'تسجيل شراء'});
    else if (low || dl < 3) A.push({lvl:dl < 1 ? 3 : 2, k:'drinks', t:d.name + ' · ' + (dl < 3 ? daysText(dl) : 'قليل'), m:meta, act:'drink-day', b:'تسجيل شراء'});
  });
  Object.values(S.shawarma).filter(d => d && d.date && d.date < today).forEach(d => skewersOf(d).forEach(([id, x]) => { if (shCalc(x).open)
    A.push({lvl:2, open:true, k:'shawarma', t:'شيش ' + x.type + ' ما تسكّر', m:dayLabel(d.date) + ' · اكتب عدد اللفات حتى يُحسب ربحه', act:'edit-sk', id, date:d.date, b:'إكمال'}); }));
  Object.values(S.kfc).filter(d => d && d.date && d.date < today).forEach(d => batchesOf(d).forEach(([id, x]) => { if (kfcCalc(x).open)
    A.push({lvl:2, open:true, k:'kfc', t:'دفعة كنتاكي ما تسكّرت', m:dayLabel(d.date) + ' · اكتب الوجبات المباعة', act:'edit-kfc', id, date:d.date, b:'إكمال'}); }));
  Object.entries(S.feasts).forEach(([id, f]) => { if (!f || !f.date) return; const n = daysTo(f.date), live = f.status === 'booked' || f.status === 'prep';
    if (live && n <= 2) A.push({lvl:n <= 0 ? 3 : 2, k:'feasts', t:'طلبية ' + f.name + ' ' + countdown(f.date), m:toArr(f.items).filter(i => +i.q).map(i => i.name + ' ×' + i.q).join('، ') + (feastLeft(f) ? ' · باقي ' + fmt(feastLeft(f)) + ' د.ع' : ''), tab:'feasts', b:'فتح'});
    else if (f.status === 'done' && feastLeft(f) > 0) A.push({lvl:2, k:'feasts', t:'باقي فلوس على ' + f.name, m:fmt(feastLeft(f)) + ' د.ع من طلبية ' + dayLabel(f.date, false), act:'feast-pay', id, b:'استلام'}); });
  const unread = Object.values(S.notes).filter(isUnread).length;
  if (unread) A.push({lvl:1, k:'notes', t:unread + ' ملاحظة جديدة من ' + roleName(otherRole()), m:'اقرأها وأشّر «قرأتها»', tab:'notes', b:'فتح'});
  const on = sortByName(S.staff).filter(([sid, st]) => effShift(st, sid, today) !== 'off');
  if (on.length && new Date().getHours() >= 12 && covered('att', today) && on.every(([sid]) => !attMark(today, sid)))
    A.push({lvl:1, k:'staff', t:'حضور اليوم ما تسجّل', m:on.length + ' عامل بالدوام اليوم', act:'go-att', b:'تسجيل'});
  return A.sort((a, b) => b.lvl - a.lvl);
}

/* a store card for a stock item feeding a production section (KFC chicken, shawarma meat) */
function storeCard(id, title, k){
  const it = S.items[id]; if (!it) return '';
  const use = usageLog(), du = itemUse(use, id), q = +it.qty || 0, dl = du > 0 ? q / du : Infinity, st = statusOf(it);

    <div class="store-big"><span>${NUM(fmtQ(q))} <small>${esc(it.unit)}</small></span>${hw && q > 0 ? `<span class="store-alt">≈ ${NUM(fmt(kgOf(it, 1) ? q / kgOf(it, 1) / hw : 0))} دجاجة</span>` : ''}</div>
    <div class="meter ${dl < 2 ? 'out' : st}"><i style="width:${Math.max(3, Math.min(100, du ? dl / 7 * 100 : (+it.min ? q / (it.min * 3) * 100 : 100)))}%"></i></div>
    <div class="store-meta">${du ? `<span>تستهلك ~${NUM(fmtQ(du))} ${esc(it.unit)} باليوم</span>` : '<span>الاستهلاك يظهر بعد أول دفعات</span>'}${+it.min ? `<span>التنبيه عند ${NUM(fmtQ(it.min))}</span>` : `<button class="btn btn-ghost btn-sm" data-act="edit-item" data-id="${id}">حدّد التنبيه</button>`}</div>
    <div class="store-acts"><button class="btn btn-sm btn-primary" data-act="buy" data-id="${id}">${ic('buy')} شراء</button>${k === 'kfc' ? `<button class="btn btn-sm btn-ghost" data-act="kfc-unlink">تغيير المادة</button>` : ''}</div></div>`;
}

/* ================= sheet & toast ================= */
let lastFocus = null;
function openSheet(title, html, mount){
  lastFocus = document.activeElement;
  const el = $('#sheet');
  $('#sheet-title').textContent = title;
  const old = el.querySelector('.sheet-body'), body = old.cloneNode(false);
  old.replaceWith(body);
  body.innerHTML = html;
  el.hidden = false;
  mount && mount(body);
  const first = body.querySelector('input:not([type=checkbox]):not([type=radio]),textarea,select');
  if (first && window.matchMedia('(min-width:700px)').matches) first.focus();
}
function closeSheet(){ $('#sheet').hidden = true; $('#sheet .sheet-body').innerHTML = ''; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch(e){} }
let toastT = null;
function toast(msg, bad){
  const t = $('#toast'); t.innerHTML = (bad ? '' : ic('check')) + '<span>' + esc(msg) + '</span>'; t.className = bad ? 'bad' : ''; t.hidden = true; void t.offsetWidth; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, bad ? 4200 : 2400);
}
function bindForm(body, onSubmit){
  const f = body.querySelector('form');
  f.addEventListener('submit', e => { e.preventDefault(); onSubmit(f); });
  return f;
}
function sheetDelete(body, label, fn){
  const b = body.querySelector('[data-sdel]'); if (!b) return;
  let armed = false;
  b.addEventListener('click', () => { if (!armed){ armed = true; b.textContent = 'اضغط مرة ثانية للتأكيد'; return; } fn(); });
}
const val = (f, id) => f.querySelector('#' + id).value;
const setErr = (f, msg) => { const e = f.querySelector('.err'); if (e) e.textContent = msg || ''; };
const formActions = (delLabel) => `<p class="err" role="alert"></p><div class="form-actions"><div class="main-acts"><button class="btn btn-primary" type="submit">حفظ</button><button type="button" class="btn btn-ghost" data-close>إلغاء</button></div>${delLabel ? `<button type="button" class="btn btn-sm btn-danger" data-sdel>${delLabel}</button>` : ''}</div>`;
